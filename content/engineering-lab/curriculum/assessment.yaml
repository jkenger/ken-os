# The Engineering assessment: 5 fixed questions, one per area, asked in this order. Spec:
# docs/architecture/engineering-rebuild.md, section 3 (Assessment). The Assessor grades each answer against its rubric;
# a pass needs every rubric line. A predict question also lists the exact console output, which is compared first.
#
# Approved by the owner on 2026-10-10 by choosing the reference prototype's question set. Change it in a reviewed commit
# and move reviewedOn. A retake uses the same questions. Wording is plain: no term a smart person outside the
# field would have to look up, unless the question is about that term (docs/product/app-language.md, Question wording).
# Reworded in plain language on 2026-10-10 at the owner's request; what each question checks is unchanged.

status: approved
reviewedOn: "2026-10-10"

questions:
  - id: foundations-microtasks
    area: foundations
    kind: predict
    prompt: What does this code print, and in what order?
    code: |-
      console.log("A");
      Promise.resolve().then(() => console.log("B"));
      console.log("C");
    expectedOutput: [A, C, B]
    rubric:
      - Prints A, C, B
      - Explains that the plain lines run first, and the promise callback waits until they finish

  - id: frontend-stale-response
    area: frontend
    kind: explain
    prompt: >-
      A React component loads data in an effect every time a value it depends on changes. When the replies come back
      out of order, an older reply can replace newer data on screen. How would you stop that?
    rubric:
      - Cancels the old request, or ignores its reply when it arrives
      - Tells old and new requests apart, for example with a request id or the effect's cleanup

  - id: backend-oversell
    area: backend
    kind: debug
    prompt: >-
      Two customers buy the last item at the same moment. Both requests see one item left, and both purchases go
      through. Where would you check "never sell more than we have" so this can't happen?
    rubric:
      - Checks it in the database, as part of the purchase itself
      - Uses one update that only succeeds while stock is left, or locks the row during the purchase

  - id: production-payment-timeout
    area: production
    kind: failure
    prompt: >-
      A request to charge a card gets no reply before the time limit. Is it safe to send it again straight away? Explain
      why.
    rubric:
      - No reply doesn't mean the charge failed; it may have gone through
      - Sends the same request key so the payment provider can't charge twice, or checks the payment before trying again

  - id: ai-irrelevant-chunks
    area: ai
    kind: explain
    prompt: >-
      Your AI feature searches your documents for passages to answer from. It keeps finding passages that sound
      related but don't answer the question. What would you look at before switching to a different AI model?
    rubric:
      - Looks at how the documents are split, how the search is worded, or the filters it uses
      - Measures with test questions whose right passages are already known
