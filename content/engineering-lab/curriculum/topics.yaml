    depth: deep
    prove: [explain, implement]
    labs: [order-history-index]

  - id: db.query_plans
    title: Reading query plans
    module: m3-db-concurrency
    requires: [db.indexes]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      How to read EXPLAIN and EXPLAIN ANALYZE, spot the expensive step, and tell when statistics or a missing index
