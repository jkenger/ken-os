# Engineering Lab topic map. Rules: docs/architecture/engineering-lab-v0.md, section 3.
# Each gap quotes or paraphrases the 2026-10-01 baseline in docs/product/ai-engineering-learning-handoff.md.
# Validation needs every mode in `prove` to be solid, with at least one checked by code
# (a predict question or a lab), so every topic lists predict or a lab that covers one of its modes.
#
# The outline covers the whole course from the handoff's section 24. A chapter's `planned` list names topics that
# aren't written yet; they show in the Course outline, greyed, until they get a full entry under `topics`.
#
# Each chapter belongs to one area (foundations, frontend, backend, production, ai). Levels are measured per area;
# see content/engineering-lab/careers/roles.yaml and docs/architecture/engineering-lab-profile.md.

tracks:
  - id: fullstack
    title: Full-stack
    summary: From the JavaScript runtime to running a service in production.
  - id: ai
    title: AI Engineering
    summary: Retrieval, structured outputs, agents and evals, built and measured.

modules:
  - id: m1-js-runtime
    title: JavaScript runtime and async
    track: fullstack
    area: foundations
  - id: m2-http-browser
    title: HTTP and the browser
    track: fullstack
    area: foundations
  - id: m3-db-concurrency
    title: Database transactions, concurrency and indexes
    track: fullstack
    area: backend
  - id: m4-react
    title: React
    track: fullstack
    area: frontend
  - id: m4-api-boundaries
    title: API boundaries
    track: fullstack
    area: backend
  - id: m5-testing-security
    title: Testing and web security
    track: fullstack
    area: production
  - id: m6-production-reliability
    title: Production reliability
    track: fullstack
    area: production
  - id: m7-observability
    title: Observability
    track: fullstack
    area: production
  - id: m8-architecture-scale
    title: Architecture at scale
    track: fullstack
    area: production
  - id: a1-retrieval
    title: Retrieval
    track: ai
    area: ai
  - id: a2-model-interfaces
    title: Model interfaces
    track: ai
    area: ai
    planned: [Structured outputs, Tool calling, Context engineering]
  - id: a3-agents
    title: Agents
    track: ai
    area: ai
    planned: [Agent patterns, State and memory, MCP]
  - id: a4-ai-production
    title: AI in production
    track: ai
    area: ai
    planned: [Evals, AI observability, Cost and latency, Production reliability]

topics:
  - id: js.call_stack
    title: The call stack and run to completion
    module: m1-js-runtime
    requires: []
    freshness: core_concept
    sourceGroups: [javascript]
    gap: >-
      The event-loop answer described code as running top to bottom with no model of the call stack. Needs: what the
      call stack is, that a function runs to completion before anything else runs, and why a busy stack blocks every
      callback, timer and render.
    depth: working
    prove: [predict, explain]
    labs: []

  - id: js.event_loop
    title: Event loop, tasks and microtasks
    module: m1-js-runtime
    requires: [js.call_stack]
    freshness: web_platform
    sourceGroups: [javascript]
    gap: >-
      Predicted A B D C for sync logs, setTimeout(..., 0) and Promise.resolve().then(...). Believes code runs top to
      bottom with timers and promises as generic async. Needs: synchronous code first, then the whole microtask queue,
      then the next task; where setTimeout, promise callbacks and queueMicrotask land.
    depth: deep
    prove: [predict, explain, debug]
    labs: [event-loop-order]

  - id: js.promises
    title: Promises and async/await ordering
    module: m1-js-runtime
    requires: [js.event_loop]
    freshness: web_platform
    sourceGroups: [javascript]
    gap: >-
      No reliable model of when promise callbacks and code after await run. Needs: promise states, then callbacks as
      microtasks, await as a pause that resumes in a microtask, chaining, error propagation and unhandled rejections.
    depth: working
    prove: [predict, explain]
    labs: []

  - id: js.closures
    title: Closures and captured variables
    module: m1-js-runtime
    requires: [js.call_stack]
    freshness: core_concept
    sourceGroups: [javascript]
    gap: >-
      Could not explain closures and thought captured state only exists after the function is invoked. Needs: a
      function keeps its surrounding scope from when it was created, closure lifetime, let versus var in loops, and how
      this produces stale values in callbacks.
    depth: working
    prove: [predict, explain, debug]
    labs: [closure-loop]

  - id: js.references_mutation
    title: References, equality and shallow copies
    module: m1-js-runtime
    requires: []
    freshness: core_concept
    sourceGroups: [javascript]
    gap: >-
      Predicted nested objects become different after object spread and said objects cannot be compared with ===.
      Needs: reference versus value, === on objects compares identity, spread copies one level so nested objects stay
      shared, and structuredClone for deep copies.
    depth: working
    prove: [predict, explain, debug]
    labs: [shallow-copy]

  - id: js.async_races
    title: Async request races and cancellation
    module: m1-js-runtime
    requires: [js.promises, js.closures]
    freshness: web_platform
    sourceGroups: [javascript, react]
    gap: >-
      Thought useCallback would fix an out-of-order search response and worried a [query] dependency would loop
      forever. Needs: why responses arrive out of order, ignoring stale responses, AbortController cancellation,
      debouncing, and timeouts with AbortSignal.timeout.
    depth: working
    prove: [explain, implement]
    labs: [search-race]

  # Module 2. Predictions are checked by probes that run real requests; the Assessor covers explain.
  - id: web.request_lifecycle
    title: From URL to response, including HTTPS
    module: m2-http-browser
    requires: []
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      Could not explain what happens between typing a URL and seeing a page, had no working model of DNS, and described
      HTTP as local or unsecured and HTTPS as public. Needs: DNS lookup, TCP and TLS at concept level, HTTPS as HTTP
      inside TLS (encryption, integrity, server identity), the request and response, and which headers the browser adds.
    depth: working
    prove: [explain, predict]
    labs: [request-anatomy]

  - id: web.cookies_sessions
    title: Cookies and sessions
    module: m2-http-browser
    requires: [web.request_lifecycle]
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      Remembered credentials include and origin ideas, but the browser's cookie and session rules were unclear. Needs:
      how a server-set cookie becomes a session, Path, Max-Age, HttpOnly, Secure, SameSite, and when a cookie travels
      with a request.
    depth: working
    prove: [explain, predict]
    labs: [cookie-rules]

  - id: web.cors
    title: CORS, and what it does not protect
    module: m2-http-browser
    requires: [web.cookies_sessions]
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      Described CORS as protection against unauthorized bad actors. Needs: CORS is a browser rule about which origins
      may read a response, not server authorization; simple versus preflighted requests; credentials and the wildcard.
    depth: working
    prove: [explain, predict]
    labs: [cors-rules]

  - id: web.http_caching
    title: Browser caching and HTTP cache headers
    module: m2-http-browser
    requires: [web.request_lifecycle]
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      Could not tell browser caching from server caching. Needs: Cache-Control max-age, no-cache and no-store, ETag
      revalidation and 304, private versus shared caches, and where a CDN or server cache sits relative to the browser.
    depth: working
    prove: [explain, predict]
    labs: [cache-rules]

  # Module 3. Labs run on PGlite in the browser; concurrent calls interleave between queries, as real requests do.
  - id: db.transactions
    title: Transactions and all-or-nothing writes
    module: m3-db-concurrency
    requires: []
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      Baseline was solid: related writes should roll back together. Check it in code, including that a failure in the
      middle leaves nothing behind, and that a database transaction cannot undo emails or calls to other services.
    depth: working
    prove: [explain, implement]
    labs: [transfer-rollback]

  - id: db.constraints
    title: Constraints as the source of truth
    module: m3-db-concurrency
    requires: [db.transactions]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      Knew database uniqueness beats application checks but not why. Needs: why check-then-insert races, unique
      constraints and expression indexes, and handling a unique violation as a normal outcome.
    depth: working
    prove: [explain, debug]
    labs: [unique-signup]

  - id: db.lost_update
    title: Lost updates
    module: m3-db-concurrency
    requires: [db.transactions]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      Sensed possible inconsistency but could not explain lost updates or isolation, or two buyers both succeeding on
      the same stock. Needs: read-modify-write races, why a transaction alone does not prevent them at the default
      isolation level, and the options that do.
    depth: deep
    prove: [explain, debug]
    labs: [stock-race]

  - id: db.atomic_updates
    title: Atomic updates and conditional writes
    module: m3-db-concurrency
    requires: [db.lost_update]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      No working fix for concurrent stock decrements. Needs: doing the check and the change in one statement,
      UPDATE with WHERE and RETURNING, and when to reach for row locks or a stricter isolation level instead.
    depth: working
    prove: [explain, implement]
    labs: [stock-race]

  - id: db.indexes
    title: What an index is and when Postgres uses it
    module: m3-db-concurrency
    requires: []
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      Knew indexes help on large tables but could not design or inspect one. Needs: B-tree basics, Seq Scan versus
      Index Scan, reading EXPLAIN, and the write and storage cost of an index.
    depth: working
    prove: [explain, implement]
    labs: [email-lookup]

  - id: db.composite_indexes
    title: Composite indexes and column order
    module: m3-db-concurrency
    requires: [db.indexes]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      No model of composite indexes; for a slow user_id plus created_at query, only suggested selecting fewer columns.
      Needs: how column order decides which queries an index can serve, and an index that also returns rows in order.
    depth: deep
    prove: [explain, implement]
    labs: [order-history-index]

  - id: db.query_plans
    title: Reading query plans
    module: m3-db-concurrency
    requires: [db.indexes]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      Missed the execution plan and scan and sort behavior when diagnosing a slow query. Needs: reading EXPLAIN and
      EXPLAIN ANALYZE, Index Cond versus Filter, Sort nodes, and row estimates versus actual rows.
    depth: working
    prove: [explain, debug]
    labs: [order-history-index]

  - id: api.idempotency_basics
    title: Idempotent create requests
    module: m3-db-concurrency
    requires: [db.constraints, db.atomic_updates]
    freshness: core_concept
    sourceGroups: [web, database]
    gap: >-
      No working model of idempotency; missed that a retried create needs a stable request key. Needs: which HTTP
      methods are idempotent, idempotency keys, enforcing them with a unique constraint, and returning the original
      result on a retry.
    depth: working
    prove: [explain, implement]
    labs: [idempotent-payment]

  - id: api.runtime_validation
    title: Runtime validation at trust boundaries
    module: m4-api-boundaries
    requires: []
    freshness: framework
    sourceGroups: [typescript, javascript, web]
    gap: >-
      Knows incoming data should be validated, but mixes validation with unrelated checks such as whether a record
      exists or who may change it. Needs: TypeScript types are erased at runtime, so every trust boundary (request
      bodies, query strings, environment, third-party responses) needs a runtime check; parsing into a new typed value
      instead of checking and passing the input through; dropping unknown fields so extra ones like isAdmin never reach
      the database; and reporting every error with its field.
    depth: working
    prove: [explain, implement]
    labs: [order-input]

  - id: api.pagination
    title: Offset and cursor pagination
    module: m4-api-boundaries
    requires: [db.indexes]
    freshness: core_concept
    sourceGroups: [database, web]
    gap: >-
      Knows pages exist but can't explain how offset and cursor paging differ. Needs: an offset recounts from the top,
      so rows shift when new ones arrive and deep pages read every skipped row; a cursor continues after the last row
      seen; a unique tiebreaker such as id in both the order and the cursor; an index that matches the order; and an
      opaque cursor the client only hands back.
    depth: deep
    prove: [explain, implement]
    labs: [feed-pages]

  - id: test.strategy
    title: Testing strategy and tests that catch bugs
    module: m5-testing-security
    requires: []
    freshness: framework
    sourceGroups: [testing, javascript]
    gap: >-
      Can name unit, integration and end-to-end tests but not say what each is for, and isn't sure when to use a real
      database, a fake or a mock. Needs: a test earns its place by failing when the code is wrong; bugs hide at edges,
      so cases sit at each rule's boundary; fast unit tests for logic, integration tests against a real database for
      queries and constraints, a few end-to-end tests for the paths users take; and mocks only at boundaries you don't
      own.
    depth: working
    prove: [explain, implement]
    labs: [discount-tests]

  - id: sec.xss
    title: XSS and output encoding
    module: m5-testing-security
    requires: []
    freshness: web_platform
    sourceGroups: [web, operations, react]
    gap: >-
      Little working model of cross-site scripting. Needs: how text from one user becomes code in another user's
      browser; encoding on output for the context (HTML text, attributes, URLs); why a javascript: link is dangerous
      even when escaped; what React escapes by default and what dangerouslySetInnerHTML turns off; and a Content
      Security Policy as a second line of defence.
    depth: working
    prove: [explain, implement]
    labs: [comment-render]

  - id: sec.resource_authorization
    title: Resource authorization, ownership and tenant scope
    module: m5-testing-security
    requires: [db.constraints]
    freshness: core_concept
    sourceGroups: [operations, database, web]
    gap: >-
      Knows that signing in isn't enough, but reaches for checking who the user is rather than whether they belong to
      the resource's organisation with a role that allows the action. Needs: authentication versus authorization;
      checking membership and role on every read and write, in the same query; answering outsiders as "not found" so
      ids can't be probed; and tenant scope that a client can't change.
    depth: deep
    prove: [explain, implement]
    labs: [team-docs]

  - id: react.render_model
    title: How React renders, and why references matter
    module: m4-react
    requires: [js.references_mutation]
    freshness: framework
    sourceGroups: [react]
    gap: >-
      Knows state, props and context can trigger a render and mentions the virtual DOM, but render, reconciliation and
      commit are hazy. Needs: what render, reconcile and commit each do; that React compares references, so state
      updates build new objects along the changed path and reuse the rest; why mutating state can mean nothing
      re-renders; and when memo helps and when it doesn't.
    depth: working
    prove: [explain, implement]
    labs: [todo-updates]

  - id: react.effects
    title: Effects and synchronization
    module: m4-react
    requires: [react.render_model, js.closures]
    freshness: framework
    sourceGroups: [react]
    gap: >-
      Expects an effect with [] to re-run when props change and links dependencies to infinite loops. Needs: an effect
      keeps something outside React in step with the current render; every value it reads belongs in its dependencies;
      cleanup undoes the setup and runs before the next run and on unmount; stale closures and races in effects; and
      when no effect is needed at all, because the value can be computed during render.
    depth: deep
    prove: [explain, implement]
    labs: [chat-connection]

  - id: rel.background_jobs
    title: Background jobs and queues
    module: m6-production-reliability
    requires: [db.atomic_updates]
    freshness: core_concept
    sourceGroups: [database, operations]
    gap: >-
      Slow work moves to a queue, but claiming jobs safely is the hard part. Needs: claiming a job atomically so two
      workers never take the same one (FOR UPDATE SKIP LOCKED); leases so a crashed worker's job is picked up again;
      backoff and a dead state for jobs that keep failing; and why every job must be safe to run twice.
    depth: working
    prove: [explain, implement]
    labs: [job-queue]

  - id: rel.retry_backoff
    title: Retry with backoff and jitter
    module: m6-production-reliability
    requires: [api.idempotency_basics]
    freshness: core_concept
    sourceGroups: [operations, web]
    gap: >-
      No confident model of retries. Needs: which failures are worth retrying and which never succeed; exponential
      backoff with a cap; jitter so clients don't retry in lockstep; honouring Retry-After; a retry budget; and why a
      retried request must be idempotent.
    depth: working
    prove: [explain, implement]
    labs: [retry-policy]

  - id: rel.timeouts
    title: Timeouts and cancellation
    module: m6-production-reliability
    requires: [js.promises]
    freshness: core_concept
    sourceGroups: [javascript, web, operations]
    gap: >-
      Needs: every call to another service gets a timeout chosen from how long it normally takes; a timeout must also
      cancel the work (AbortSignal), or the work keeps holding connections; clearing timers after success; and deadlines
      that shrink as a request passes through several services.
    depth: working
    prove: [explain, implement]
    labs: [request-timeout]

  - id: rel.partial_failures
    title: Partial failures and compensation
    module: m6-production-reliability
    requires: [db.transactions]
    freshness: core_concept
    sourceGroups: [operations, database]
    gap: >-
      Knows a database transaction rolls back together, but not what to do when steps span services that can't share
      one. Needs: sagas, where each completed step registers how to undo itself and a failure runs the undo steps newest
      first; undo steps that are safe to repeat; and surfacing an undo that fails for a person to resolve.
    depth: deep
    prove: [explain, implement]
    labs: [order-saga]

  - id: rel.graceful_degradation
    title: Graceful degradation and circuit breakers
    module: m6-production-reliability
    requires: [rel.timeouts]
    freshness: core_concept
    sourceGroups: [operations]
    gap: >-
      Needs: keeping the core of a page working when a dependency fails; circuit breakers that fail fast after repeated
      failures and test recovery with one trial call; fallbacks such as cached or popular content; and what the user
      should see while a feature is degraded.
    depth: working
    prove: [explain, implement]
    labs: [circuit-breaker]

  - id: obs.logs
    title: Structured logs
    module: m7-observability
    requires: []
    freshness: core_concept
    sourceGroups: [operations]
    gap: >-
      Knows logs should hold errors and request context and avoid sensitive data. Needs: one JSON object per event with
      consistent field names; request, trace and user ids carried through a child logger; operation, status and
      duration; redacting secrets by key at any depth; and serializing errors so the stack survives.
    depth: working
    prove: [explain, implement]
    labs: [structured-logs]

  - id: obs.metrics
    title: Metrics, percentiles and histograms
    module: m7-observability
    requires: []
    freshness: core_concept
    sourceGroups: [operations]
    gap: >-
      Needs: why averages hide the slow requests users feel; p50, p95 and p99; error rate counting only server errors;
      counters, gauges and histograms; and why cumulative histogram buckets can be combined across servers while
      averages and percentiles can't.
    depth: working
    prove: [explain, implement]
    labs: [latency-summary]

  - id: obs.traces
    title: Traces and context propagation
    module: m7-observability
    requires: [obs.logs]
    freshness: web_platform
    sourceGroups: [operations, web]
    gap: >-
      Needs: traces as a tree of spans sharing one trace id; passing context between services with the W3C traceparent
      header; strict header validation that starts a new trace instead of failing; child spans for work inside a
      service; and a trace id in every log line to join logs and traces.
    depth: working
    prove: [explain, implement]
    labs: [trace-context]

  - id: arch.caching
    title: Caching strategy
    module: m8-architecture-scale
    requires: [web.http_caching]
    freshness: core_concept
    sourceGroups: [web, operations]
    gap: >-
      Needs: deciding what may be stale and for how long; read-through caching with a TTL; preventing stampedes by
      sharing one load per key; never caching failures; invalidation on write and the race with a load already running;
      and why, across several servers, the TTL is the real guarantee.
    depth: working
    prove: [explain, implement]
    labs: [read-through-cache]

  - id: arch.scaling
    title: Scaling, concurrency limits and load shedding
    module: m8-architecture-scale
    requires: [rel.timeouts]
    freshness: core_concept
    sourceGroups: [operations]
    gap: >-
      Needs: stateless services that scale out; finding the real bottleneck, often the database; limiting concurrency to
      what a resource can handle; bounded queues that refuse work early instead of turning overload into timeouts; and
      sizing a shared limit for many servers.
    depth: working
    prove: [explain, implement]
    labs: [load-shedding]

  - id: arch.multi_tenancy
    title: Multi-tenancy and tenant isolation
    module: m8-architecture-scale
    requires: [sec.resource_authorization]
    freshness: core_concept
    sourceGroups: [database, operations]
    gap: >-
      Needs: shared-database, shared-schema and separate-database tenancy and their trade-offs; tenant ids in every
      key, composite foreign keys and per-tenant unique constraints so the database refuses cross-tenant data;
      row-level security as a second guard; and noisy neighbours.
    depth: deep
    prove: [explain, implement]
    labs: [tenant-keys]

  - id: arch.evolution
    title: System evolution and zero-downtime migrations
    module: m8-architecture-scale
    requires: [db.constraints]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      Needs: old and new code running against one database during a deploy; expand and contract migrations (add,
      backfill, sync, switch, remove); adding a required column safely; backward-compatible API changes; and why a
      one-step rename breaks a zero-downtime deploy.
    depth: working
    prove: [explain, implement]
    labs: [expand-contract]

  - id: ai.semantic_search
    title: Semantic search with embeddings
    module: a1-retrieval
    requires: []
    freshness: ai_ecosystem
    sourceGroups: [ai, database]
    gap: >-
      Has started on embeddings, vectors and approximate nearest neighbours. Needs: embeddings as directions of meaning;
      cosine similarity rather than raw dot products; filtering before ranking; a minimum score so search can return
      nothing; storage and indexes such as HNSW; and where keyword search beats embeddings.
    depth: working
    prove: [explain, implement]
    labs: [vector-search]

  - id: ai.retrieval_eval
    title: Retrieval evaluation
    module: a1-retrieval
    requires: [ai.semantic_search]
    freshness: ai_ecosystem
    sourceGroups: [ai]
    gap: >-
      Needs: a labeled set of questions and the documents that answer them; recall@k, precision@k and MRR; which matters
      most when a model reads the top few chunks; per-question results so regressions show; and evaluating retrieval
      separately from answer quality.
    depth: working
    prove: [explain, implement]
    labs: [retrieval-metrics]

  - id: ai.rag
    title: Retrieval-augmented generation
    module: a1-retrieval
    requires: [ai.semantic_search]
    freshness: ai_ecosystem
    sourceGroups: [ai]
    gap: >-
      Needs: chunking documents; building a prompt from the best chunks within a token budget; labeling sources so the
      answer can cite them; instructions to stay grounded and admit gaps; checking citations afterwards; and why
      grounding reduces but can't prevent invented answers.
    depth: working
    prove: [explain, implement]
    labs: [rag-prompt]

  - id: ai.advanced_rag
    title: Advanced RAG and hybrid search
    module: a1-retrieval
    requires: [ai.rag, ai.retrieval_eval]
    freshness: ai_ecosystem
    sourceGroups: [ai, database]
    gap: >-
      Needs: hybrid search combining keyword and vector results; reciprocal rank fusion instead of adding incomparable
      scores; diversifying results across documents; query rewriting and its cost; and measuring each change with
      retrieval metrics.
    depth: deep
    prove: [explain, implement]
    labs: [rank-fusion]

  - id: ai.reranking
    title: Reranking
    module: a1-retrieval
    requires: [ai.retrieval_eval]
    freshness: ai_ecosystem
    sourceGroups: [ai]
    gap: >-
      Needs: two-stage retrieval, where a cheap search makes a shortlist and a slower model reorders it; batching
      reranker calls; choosing the shortlist size from recall; stable ordering on ties; and the latency and cost
      trade-off.
    depth: working
    prove: [explain, implement]
    labs: [rerank-budget]
