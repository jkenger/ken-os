    depth: working
    prove: [explain, debug]
    labs: [order-history-index]

  - id: api.idempotency_basics
    title: Idempotent create requests
    module: m3-db-concurrency
    requires: [db.constraints, db.atomic_updates]
    freshness: core_concept
    sourceGroups: [web, database]
