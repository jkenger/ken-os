# Engineering Lab topic map. Rules: docs/architecture/engineering-lab-v0.md, section 3.
# Each gap quotes or paraphrases the 2026-10-01 baseline in docs/product/ai-engineering-learning-handoff.md.
# Validation needs every mode in `prove` to be solid, with at least one checked by code
# (a predict question or a lab), so every topic lists predict or a lab that covers one of its modes.
#
# The outline covers the whole course from the handoff's section 24. A chapter's `planned` list names topics that
# aren't written yet; they show in the Course outline, greyed, until they get a full entry under `topics`.

tracks:
  - id: fullstack
    title: Full-stack
    summary: From the JavaScript runtime to running a service in production.
  - id: ai
    title: AI Engineering
    summary: Retrieval, structured outputs, agents and evals, built and measured.

modules:
  - id: m1-js-runtime
    title: JavaScript runtime and async
    track: fullstack
  - id: m2-http-browser
    title: HTTP and the browser
    track: fullstack
  - id: m3-db-concurrency
    title: Database transactions, concurrency and indexes
    track: fullstack
  - id: m4-react-api-edges
    title: React and API boundaries
    track: fullstack
    planned: [React render model, Effects and synchronization, Runtime validation, Pagination]
  - id: m5-testing-security
    title: Testing and web security
    track: fullstack
    planned: [Testing strategy, Authorization in depth, XSS and web security]
  - id: m6-production-reliability
    title: Production reliability
    track: fullstack
    planned: [Background jobs, Retry and backoff, Timeouts, Partial failures, Graceful degradation]
  - id: m7-observability
    title: Observability
    track: fullstack
    planned: [Logs, Metrics, Traces]
  - id: m8-architecture-scale
    title: Architecture at scale
    track: fullstack
    planned: [Caching strategy, Scaling, Multi-tenancy, System evolution]
  - id: a1-retrieval
    title: Retrieval
    track: ai
    planned: [Semantic search, Retrieval evaluation, RAG, Advanced RAG, Reranking]
  - id: a2-model-interfaces
    title: Model interfaces
    track: ai
    planned: [Structured outputs, Tool calling, Context engineering]
  - id: a3-agents
    title: Agents
    track: ai
    planned: [Agent patterns, State and memory, MCP]
  - id: a4-ai-production
    title: AI in production
    track: ai
    planned: [Evals, AI observability, Cost and latency, Production reliability]

topics:
  - id: js.call_stack
    title: The call stack and run to completion
    module: m1-js-runtime
    requires: []
    freshness: core_concept
    sourceGroups: [javascript]
    gap: >-
      The event-loop answer described code as running top to bottom with no model of the call stack. Needs: what the
      call stack is, that a function runs to completion before anything else runs, and why a busy stack blocks every
      callback, timer and render.
    depth: working
    prove: [predict, explain]
    labs: []

  - id: js.event_loop
    title: Event loop, tasks and microtasks
    module: m1-js-runtime
    requires: [js.call_stack]
    freshness: web_platform
    sourceGroups: [javascript]
    gap: >-
      Predicted A B D C for sync logs, setTimeout(..., 0) and Promise.resolve().then(...). Believes code runs top to
      bottom with timers and promises as generic async. Needs: synchronous code first, then the whole microtask queue,
      then the next task; where setTimeout, promise callbacks and queueMicrotask land.
    depth: deep
    prove: [predict, explain, debug]
    labs: [event-loop-order]

  - id: js.promises
    title: Promises and async/await ordering
    module: m1-js-runtime
    requires: [js.event_loop]
    freshness: web_platform
    sourceGroups: [javascript]
    gap: >-
      No reliable model of when promise callbacks and code after await run. Needs: promise states, then callbacks as
      microtasks, await as a pause that resumes in a microtask, chaining, error propagation and unhandled rejections.
    depth: working
    prove: [predict, explain]
    labs: []

  - id: js.closures
    title: Closures and captured variables
    module: m1-js-runtime
    requires: [js.call_stack]
    freshness: core_concept
    sourceGroups: [javascript]
    gap: >-
      Could not explain closures and thought captured state only exists after the function is invoked. Needs: a
      function keeps its surrounding scope from when it was created, closure lifetime, let versus var in loops, and how
      this produces stale values in callbacks.
    depth: working
    prove: [predict, explain, debug]
    labs: [closure-loop]

  - id: js.references_mutation
    title: References, equality and shallow copies
    module: m1-js-runtime
    requires: []
    freshness: core_concept
    sourceGroups: [javascript]
    gap: >-
      Predicted nested objects become different after object spread and said objects cannot be compared with ===.
      Needs: reference versus value, === on objects compares identity, spread copies one level so nested objects stay
      shared, and structuredClone for deep copies.
    depth: working
    prove: [predict, explain, debug]
    labs: [shallow-copy]

  - id: js.async_races
    title: Async request races and cancellation
    module: m1-js-runtime
    requires: [js.promises, js.closures]
    freshness: web_platform
    sourceGroups: [javascript, react]
    gap: >-
      Thought useCallback would fix an out-of-order search response and worried a [query] dependency would loop
      forever. Needs: why responses arrive out of order, ignoring stale responses, AbortController cancellation,
      debouncing, and timeouts with AbortSignal.timeout.
    depth: working
    prove: [explain, implement]
    labs: [search-race]

  # Module 2. Predictions are checked by probes that run real requests; the Assessor covers explain.
  - id: web.request_lifecycle
    title: From URL to response, including HTTPS
    module: m2-http-browser
    requires: []
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      Could not explain what happens between typing a URL and seeing a page, had no working model of DNS, and described
      HTTP as local or unsecured and HTTPS as public. Needs: DNS lookup, TCP and TLS at concept level, HTTPS as HTTP
      inside TLS (encryption, integrity, server identity), the request and response, and which headers the browser adds.
    depth: working
    prove: [explain, predict]
    labs: [request-anatomy]

  - id: web.cookies_sessions
    title: Cookies and sessions
    module: m2-http-browser
    requires: [web.request_lifecycle]
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      Remembered credentials include and origin ideas, but the browser's cookie and session rules were unclear. Needs:
      how a server-set cookie becomes a session, Path, Max-Age, HttpOnly, Secure, SameSite, and when a cookie travels
      with a request.
    depth: working
    prove: [explain, predict]
    labs: [cookie-rules]

  - id: web.cors
    title: CORS, and what it does not protect
    module: m2-http-browser
    requires: [web.cookies_sessions]
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      Described CORS as protection against unauthorized bad actors. Needs: CORS is a browser rule about which origins
      may read a response, not server authorization; simple versus preflighted requests; credentials and the wildcard.
    depth: working
    prove: [explain, predict]
    labs: [cors-rules]

  - id: web.http_caching
    title: Browser caching and HTTP cache headers
    module: m2-http-browser
    requires: [web.request_lifecycle]
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      Could not tell browser caching from server caching. Needs: Cache-Control max-age, no-cache and no-store, ETag
      revalidation and 304, private versus shared caches, and where a CDN or server cache sits relative to the browser.
    depth: working
    prove: [explain, predict]
    labs: [cache-rules]

  # Module 3. Labs run on PGlite in the browser; concurrent calls interleave between queries, as real requests do.
  - id: db.transactions
    title: Transactions and all-or-nothing writes
    module: m3-db-concurrency
    requires: []
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      Baseline was solid: related writes should roll back together. Check it in code, including that a failure in the
      middle leaves nothing behind, and that a database transaction cannot undo emails or calls to other services.
    depth: working
    prove: [explain, implement]
    labs: [transfer-rollback]

  - id: db.constraints
    title: Constraints as the source of truth
    module: m3-db-concurrency
    requires: [db.transactions]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      Knew database uniqueness beats application checks but not why. Needs: why check-then-insert races, unique
      constraints and expression indexes, and handling a unique violation as a normal outcome.
    depth: working
    prove: [explain, debug]
    labs: [unique-signup]

  - id: db.lost_update
    title: Lost updates
    module: m3-db-concurrency
    requires: [db.transactions]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      Sensed possible inconsistency but could not explain lost updates or isolation, or two buyers both succeeding on
      the same stock. Needs: read-modify-write races, why a transaction alone does not prevent them at the default
      isolation level, and the options that do.
    depth: deep
    prove: [explain, debug]
    labs: [stock-race]

  - id: db.atomic_updates
    title: Atomic updates and conditional writes
    module: m3-db-concurrency
    requires: [db.lost_update]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      No working fix for concurrent stock decrements. Needs: doing the check and the change in one statement,
      UPDATE with WHERE and RETURNING, and when to reach for row locks or a stricter isolation level instead.
    depth: working
    prove: [explain, implement]
    labs: [stock-race]

  - id: db.indexes
    title: What an index is and when Postgres uses it
    module: m3-db-concurrency
    requires: []
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      Knew indexes help on large tables but could not design or inspect one. Needs: B-tree basics, Seq Scan versus
      Index Scan, reading EXPLAIN, and the write and storage cost of an index.
    depth: working
    prove: [explain, implement]
    labs: [email-lookup]

  - id: db.composite_indexes
    title: Composite indexes and column order
    module: m3-db-concurrency
    requires: [db.indexes]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      No model of composite indexes; for a slow user_id plus created_at query, only suggested selecting fewer columns.
      Needs: how column order decides which queries an index can serve, and an index that also returns rows in order.
    depth: deep
    prove: [explain, implement]
    labs: [order-history-index]

  - id: db.query_plans
    title: Reading query plans
    module: m3-db-concurrency
    requires: [db.indexes]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      Missed the execution plan and scan and sort behavior when diagnosing a slow query. Needs: reading EXPLAIN and
      EXPLAIN ANALYZE, Index Cond versus Filter, Sort nodes, and row estimates versus actual rows.
    depth: working
    prove: [explain, debug]
    labs: [order-history-index]

  - id: api.idempotency_basics
    title: Idempotent create requests
    module: m3-db-concurrency
    requires: [db.constraints, db.atomic_updates]
    freshness: core_concept
    sourceGroups: [web, database]
    gap: >-
      No working model of idempotency; missed that a retried create needs a stable request key. Needs: which HTTP
      methods are idempotent, idempotency keys, enforcing them with a unique constraint, and returning the original
      result on a retry.
    depth: working
    prove: [explain, implement]
    labs: [idempotent-payment]
