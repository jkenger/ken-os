# Engineering Lab topic map. Rules: docs/architecture/engineering-lab-v0.md, section 3.
# Each gap says what the topic teaches. Personal gaps come from the in-app baseline and later answers, never from here.
# Validation needs every mode in `prove` to be solid, with at least one checked by code
# (a predict question or a lab), so every topic lists predict or a lab that covers one of its modes.
#
# The outline covers the whole course from the handoff's section 24. A chapter's `planned` list names topics that
# aren't written yet; they show in the Course outline, greyed, until they get a full entry under `topics`.
#
# Each chapter belongs to one area (foundations, frontend, backend, production, ai). Levels are measured per area;
# see content/engineering-lab/careers/roles.yaml and docs/architecture/engineering-lab-profile.md.

tracks:
  - id: fullstack
    title: Full-stack
    summary: From the JavaScript runtime to running a service in production.
  - id: ai
    title: AI Engineering
    summary: Retrieval, structured outputs, agents and evals, built and measured.

# Books group chapters in reading order (docs/architecture/engineering-assessment-v2.md, A6). Every chapter is in exactly
# one book. Areas stay on chapters, so levels and roles don't change. Next.js foundations joins after the baseline (A7).
books:
  - id: web-foundations
    title: Web foundations
    summary: How JavaScript runs and how the browser talks to servers.
    chapters: [m1-js-runtime, m2-http-browser]
  - id: react-foundations
    title: React foundations
    summary: How React renders, and keeping effects in sync.
    chapters: [m4-react]
  - id: backend-data
    title: Backend and data
    summary: API boundaries, transactions, concurrency and indexes.
    chapters: [m4-api-boundaries, m3-db-concurrency]
  - id: production-engineering
    title: Production engineering
    summary: Testing, security, reliability, observability and scale.
    chapters: [m5-testing-security, m6-production-reliability, m7-observability, m8-architecture-scale]
  - id: ai-engineering
    title: AI engineering
    summary: Retrieval, model interfaces, agents, and running AI in production.
    chapters: [a1-retrieval, a2-model-interfaces, a3-agents, a4-ai-production]

modules:
  - id: m1-js-runtime
    title: JavaScript runtime and async
    track: fullstack
    area: foundations
  - id: m2-http-browser
    title: HTTP and the browser
    track: fullstack
    area: foundations
  - id: m3-db-concurrency
    title: Database transactions, concurrency and indexes
    track: fullstack
    area: backend
  - id: m4-react
    title: React
    track: fullstack
    area: frontend
  - id: m4-api-boundaries
    title: API boundaries
    track: fullstack
    area: backend
  - id: m5-testing-security
    title: Testing and web security
    track: fullstack
    area: production
  - id: m6-production-reliability
    title: Production reliability
    track: fullstack
    area: production
  - id: m7-observability
    title: Observability
    track: fullstack
    area: production
  - id: m8-architecture-scale
    title: Architecture at scale
    track: fullstack
    area: production
  - id: a1-retrieval
    title: Retrieval
    track: ai
    area: ai
  - id: a2-model-interfaces
    title: Model interfaces
    track: ai
    area: ai
  - id: a3-agents
    title: Agents
    track: ai
    area: ai
  - id: a4-ai-production
    title: AI in production
    track: ai
    area: ai

topics:
  - id: js.call_stack
    title: The call stack and run to completion
    module: m1-js-runtime
    requires: []
    freshness: core_concept
    sourceGroups: [javascript]
    gap: >-
      What the call stack is, that a function runs to completion before anything else runs, and why a busy stack
      blocks every callback, timer and render.
    depth: working
    prove: [predict, explain]
    labs: []

  - id: js.event_loop
    title: Event loop, tasks and microtasks
    module: m1-js-runtime
    requires: [js.call_stack]
    freshness: web_platform
    sourceGroups: [javascript]
    gap: >-
      How the event loop orders work: synchronous code first, then the whole microtask queue, then the next task;
      where setTimeout, promise callbacks and queueMicrotask land.
    depth: deep
    prove: [predict, explain, debug]
    labs: [event-loop-order]

  - id: js.promises
    title: Promises and async/await ordering
    module: m1-js-runtime
    requires: [js.event_loop]
    freshness: web_platform
    sourceGroups: [javascript]
    gap: >-
      When promise callbacks and code after await actually run, what an async function returns, and how errors and
      Promise.all behave.
    depth: working
    prove: [predict, explain]
    labs: []

  - id: js.closures
    title: Closures and captured variables
    module: m1-js-runtime
    requires: [js.call_stack]
    freshness: core_concept
    sourceGroups: [javascript]
    gap: >-
      What a closure captures, why callbacks made in a loop with var share one variable, and how factories give each
      call its own state.
    depth: working
    prove: [predict, explain, debug]
    labs: [closure-loop]

  - id: js.references_mutation
    title: References, equality and shallow copies
    module: m1-js-runtime
    requires: []
    freshness: core_concept
    sourceGroups: [javascript]
    gap: >-
      How objects and arrays are shared by reference, what equality compares, and why spread makes only a shallow
      copy.
    depth: working
    prove: [predict, explain, debug]
    labs: [shallow-copy]

  - id: js.async_races
    title: Async request races and cancellation
    module: m1-js-runtime
    requires: [js.promises, js.closures]
    freshness: web_platform
    sourceGroups: [javascript, react]
    gap: >-
      Why responses can arrive out of order, how to ignore or cancel stale requests, and what AbortController does.
    depth: working
    prove: [explain, implement]
    labs: [search-race]

  # Module 2. Predictions are checked by probes that run real requests; the Assessor covers explain.
  - id: web.request_lifecycle
    title: From URL to response, including HTTPS
    module: m2-http-browser
    requires: []
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      What happens from typing a URL to getting a response: DNS, TCP, TLS, the request, status codes and the meaning
      of HTTP methods.
    depth: working
    prove: [explain, predict]
    labs: [request-anatomy]

  - id: web.cookies_sessions
    title: Cookies and sessions
    module: m2-http-browser
    requires: [web.request_lifecycle]
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      How cookies carry a session, what HttpOnly, Secure and SameSite do, and why cookie-authenticated writes need
      CSRF protection.
    depth: working
    prove: [explain, predict]
    labs: [cookie-rules]

  - id: web.cors
    title: CORS, and what it does not protect
    module: m2-http-browser
    requires: [web.cookies_sessions]
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      What the same-origin policy blocks, how CORS headers and preflights allow cross-origin reads, and why CORS is
      not access control.
    depth: working
    prove: [explain, predict]
    labs: [cors-rules]

  - id: web.http_caching
    title: Browser caching and HTTP cache headers
    module: m2-http-browser
    requires: [web.request_lifecycle]
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      How Cache-Control, ETag and revalidation decide what the browser reuses, and how to cache safely without
      leaking personal data.
    depth: working
    prove: [explain, predict]
    labs: [cache-rules]

  # Module 3. Labs run on PGlite in the browser; concurrent calls interleave between queries, as real requests do.
  - id: db.transactions
    title: Transactions and all-or-nothing writes
    module: m3-db-concurrency
    requires: []
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      How a transaction makes several writes all-or-nothing, when to roll back, and why transactions should stay
      short.
    depth: working
    prove: [explain, implement]
    labs: [transfer-rollback]

  - id: db.constraints
    title: Constraints as the source of truth
    module: m3-db-concurrency
    requires: [db.transactions]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      Why unique, foreign key and check constraints are the real source of truth, and how to handle a violation as a
      normal outcome.
    depth: working
    prove: [explain, debug]
    labs: [unique-signup]

  - id: db.lost_update
    title: Lost updates
    module: m3-db-concurrency
    requires: [db.transactions]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      How read-modify-write loses concurrent changes, and how atomic updates, row locks or version checks prevent
      it.
    depth: deep
    prove: [explain, debug]
    labs: [stock-race]

  - id: db.atomic_updates
    title: Atomic updates and conditional writes
    module: m3-db-concurrency
    requires: [db.lost_update]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      How a single conditional statement checks and changes data together, and how to tell whether it took effect.
    depth: working
    prove: [explain, implement]
    labs: [stock-race]

  - id: db.indexes
    title: What an index is and when Postgres uses it
    module: m3-db-concurrency
    requires: []
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      What an index is, when Postgres chooses it over a sequential scan, and what indexes cost on writes.
    depth: working
    prove: [explain, implement]
    labs: [email-lookup]

  - id: db.composite_indexes
    title: Composite indexes and column order
    module: m3-db-concurrency
    requires: [db.indexes]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      Which queries a composite index can serve, why column order matters, and how an index can also provide sort
