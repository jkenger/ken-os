# Engineering topic map: 5 areas, 13 chapters, 40 topics. Spec: docs/architecture/engineering-rebuild.md, section 1.
# Areas keep their ids; kept topics keep theirs so saved source packets still match. Each gap says what the topic
# teaches; personal gaps come from answers, never from here.
#
# Every topic has exactly one exercise (a lab under labs/). `prove` lists the modes the topic is checked in, and at
# least one must be predict or a mode its lab covers, so proof always rests on code as well as words.
# After editing, run `pnpm --filter @ken-os/web lab:generate`.

areas:
  - id: foundations
    title: Foundations
    chapters:
      - id: js-runtime
        title: JavaScript runtime & async
      - id: http-browser
        title: HTTP & the browser
  - id: frontend
    title: Frontend
    chapters:
      - id: react
        title: React
  - id: backend
    title: Backend & Data
    chapters:
      - id: api-boundaries
        title: API boundaries
      - id: databases
        title: Databases
  - id: production
    title: Production
    chapters:
      - id: testing-security
        title: Testing & security
      - id: reliability
        title: Reliability
      - id: observability
        title: Observability
      - id: architecture
        title: Architecture at scale
  - id: ai
    title: Applied AI
    chapters:
      - id: retrieval
        title: Retrieval
      - id: model-interfaces
        title: Model interfaces
      - id: agents
        title: Agents
      - id: ai-production
        title: AI in production

topics:
  # Foundations · JavaScript runtime & async
  - id: js.call_stack
    title: Call stack
    chapter: js-runtime
    requires: []
    freshness: core_concept
    sourceGroups: [javascript]
    gap: >-
      What the call stack is, that a function runs to completion before anything else runs, and why a busy stack
      blocks every callback, timer and render.
    depth: working
    prove: [predict, explain, debug]
    labs: [call-stack-block]

  - id: js.promises
    title: Promises
    chapter: js-runtime
    requires: [js.call_stack]
    freshness: web_platform
    sourceGroups: [javascript]
    gap: >-
      When promise callbacks and code after await actually run, what an async function returns, and how errors and
      Promise.all behave.
    depth: working
    prove: [predict, explain]
    labs: [event-loop-order]

  - id: js.event_loop
    title: Event loop
    chapter: js-runtime
    requires: [js.promises]
    freshness: web_platform
    sourceGroups: [javascript]
    gap: >-
      How the event loop orders work: synchronous code first, then the whole microtask queue, then the next task;
      where setTimeout, promise callbacks and queueMicrotask land.
    depth: deep
    prove: [predict, explain, debug]
    labs: [event-loop-order]

  - id: js.closures
    title: Closures
    chapter: js-runtime
    requires: [js.call_stack]
    freshness: core_concept
    sourceGroups: [javascript]
    gap: >-
      What a closure captures, why callbacks made in a loop with var share one variable, and how factories give each
      call its own state.
    depth: working
    prove: [predict, explain, debug]
    labs: [closure-loop]

  # Foundations · HTTP & the browser. Predictions are checked by probes that run real requests.
  - id: web.http_semantics
    title: HTTP semantics
    chapter: http-browser
    requires: []
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      What HTTP methods, status codes and headers mean, which methods are safe or idempotent, and what a client can
      conclude from a response.
    depth: working
    prove: [explain, predict]
    labs: [request-anatomy]

  - id: web.cookies_cors
    title: Cookies & CORS
    chapter: http-browser
    requires: [web.http_semantics]
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      How cookies are scoped and sent, what the same-origin policy blocks, how CORS headers and preflights allow
      cross-origin reads, and why CORS is not access control.
    depth: working
    prove: [explain, predict]
    labs: [cors-rules]

  - id: web.http_caching
    title: HTTP caching
    chapter: http-browser
    requires: [web.http_semantics]
    freshness: web_platform
    sourceGroups: [web]
    gap: >-
      How Cache-Control, ETag and revalidation decide what the browser reuses, and how to cache safely without
      leaking personal data.
    depth: working
    prove: [explain, predict]
    labs: [cache-rules]

  # Frontend · React
  - id: react.render_model
    title: State & rendering
    chapter: react
    requires: [js.closures]
    freshness: framework
    sourceGroups: [react]
    gap: >-
      When React re-renders, how references in props affect it, when state updates apply, and why list keys matter.
    depth: working
    prove: [explain, implement]
    labs: [todo-updates]

  - id: react.effects
    title: Effects & dependencies
    chapter: react
    requires: [react.render_model]
    freshness: framework
    sourceGroups: [react]
    gap: >-
      What effects are for, how to keep dependencies honest, how cleanup works, and how to handle stale fetch
      responses.
    depth: deep
    prove: [explain, implement]
    labs: [chat-connection]

  - id: react.component_boundaries
    title: Component boundaries
    chapter: react
    requires: [react.render_model]
    freshness: framework
    sourceGroups: [react]
    gap: >-
      Where to split a component, where each piece of state should live, and how lifting state up or passing children
      keeps components small and predictable.
    depth: working
    prove: [explain, implement]
    labs: [component-split]

  # Backend & Data · API boundaries
  - id: api.runtime_validation
    title: Runtime validation
    chapter: api-boundaries
    requires: []
    freshness: framework
    sourceGroups: [typescript, javascript, web]
    gap: >-
      Why every input crossing a trust boundary must be validated at runtime with a schema, including third-party
      and model output.
    depth: working
    prove: [explain, implement]
    labs: [order-input]

  - id: sec.resource_authorization
    title: Authorization
    chapter: api-boundaries
    requires: []
    freshness: core_concept
    sourceGroups: [operations, database, web]
    gap: >-
      How to check ownership and tenant on every request on the server, and why hidden links are not authorization.
    depth: deep
    prove: [explain, implement]
    labs: [team-docs]

  - id: api.error_contracts
    title: Error contracts
    chapter: api-boundaries
    requires: [api.runtime_validation]
    freshness: core_concept
    sourceGroups: [web]
    gap: >-
      How an API reports every failure in one predictable shape, with the right status code, a stable machine-readable
      code, and no internal details leaked to the caller.
    depth: working
    prove: [explain, implement]
    labs: [error-shape]

  # Backend & Data · Databases. Labs run on PGlite in the browser; concurrent calls interleave between queries.
  - id: db.transactions
    title: Transactions
    chapter: databases
    requires: []
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      How a transaction makes several writes all-or-nothing, when to roll back, and why transactions should stay
      short.
    depth: working
    prove: [explain, implement]
    labs: [transfer-rollback]

  - id: db.composite_indexes
    title: Composite indexes
    chapter: databases
    requires: []
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      What an index is and when Postgres uses it, which queries a composite index can serve, why column order
      matters, and how to read the plan that proves it.
    depth: deep
    prove: [explain, implement]
    labs: [order-history-index]

  - id: db.concurrency
    title: Concurrency
    chapter: databases
    requires: [db.transactions]
    freshness: core_concept
    sourceGroups: [database]
    gap: >-
      How read-modify-write loses concurrent changes, and how one conditional update, a row lock or a version check
      keeps an invariant under concurrent requests.
    depth: deep
    prove: [explain, debug, implement]
    labs: [stock-race]

  # Production · Testing & security
  - id: test.strategy
    title: Test boundaries
    chapter: testing-security
    requires: []
    freshness: framework
    sourceGroups: [testing, javascript]
    gap: >-
      How to write tests that fail when behaviour breaks: testing through public interfaces, choosing unit or
      integration tests, and avoiding flakiness.
    depth: working
    prove: [explain, implement]
    labs: [discount-tests]

  - id: sec.injection
    title: Injection prevention
    chapter: testing-security
    requires: []
    freshness: web_platform
    sourceGroups: [web, operations, database, react]
    gap: >-
      How untrusted text turns into code, as SQL in a query or as script in a page, and how parameterized queries,
      context-aware output encoding and a Content Security Policy prevent it.
    depth: working
    prove: [explain, implement]
    labs: [comment-render]

  - id: sec.sessions
    title: Session security
    chapter: testing-security
    requires: [web.cookies_cors]
    freshness: web_platform
    sourceGroups: [web, operations]
    gap: >-
      How to issue, carry and end a session safely: opaque ids, HttpOnly, Secure and SameSite cookies, a new id on
      sign-in, expiry, and CSRF protection for cookie-authenticated writes.
    depth: working
    prove: [explain, predict]
    labs: [cookie-rules]

  # Production · Reliability
  - id: rel.background_jobs
    title: Background jobs
    chapter: reliability
    requires: [db.concurrency]
    freshness: core_concept
    sourceGroups: [database, operations]
    gap: >-
      How to move slow work into queues with idempotent jobs, retries, dead-letter handling and safe claiming by
      workers.
    depth: working
    prove: [explain, implement]
    labs: [job-queue]

  - id: rel.retry_backoff
    title: Retry & backoff
    chapter: reliability
    requires: [web.http_semantics]
    freshness: core_concept
    sourceGroups: [operations, web]
    gap: >-
      Why a timeout is an uncertain outcome, when repeating an operation is safe, and how exponential backoff, a cap
      and jitter keep retries bounded.
    depth: working
    prove: [explain, implement]
    labs: [retry-policy]

  - id: rel.timeouts
    title: Timeouts
    chapter: reliability
    requires: [js.promises]
    freshness: core_concept
    sourceGroups: [javascript, web, operations]
    gap: >-
      Why every outbound call needs a timeout, what an unknown outcome means, and how deadlines propagate down a
      call chain.
    depth: working
    prove: [explain, implement]
    labs: [request-timeout]

  - id: rel.partial_failures
    title: Partial failures
    chapter: reliability
    requires: [db.transactions]
    freshness: core_concept
    sourceGroups: [operations, database]
    gap: >-
      How to handle multi-step operations where some steps fail: required versus deferrable steps, compensation and
      sagas.
    depth: deep
    prove: [explain, implement]
    labs: [order-saga]

  # Production · Observability
  - id: obs.logs
    title: Structured logs
    chapter: observability
    requires: []
    freshness: core_concept
    sourceGroups: [operations]
    gap: >-
      How to write structured logs with request ids, outcomes and durations, without logging secrets or personal
      data.
    depth: working
    prove: [explain, implement]
    labs: [structured-logs]

  - id: obs.traces
    title: Tracing
    chapter: observability
    requires: [obs.logs]
    freshness: web_platform
    sourceGroups: [operations, web]
    gap: >-
      How a trace follows one request across services with spans and propagated context, and when to use traces,
      logs or metrics.
    depth: working
    prove: [explain, implement]
    labs: [trace-context]

  - id: obs.metrics
    title: Metrics
    chapter: observability
    requires: []
    freshness: core_concept
    sourceGroups: [operations]
    gap: >-
      How rates, errors and latency are measured, why percentiles beat averages, and how histograms and labels work.
    depth: working
    prove: [explain, implement]
    labs: [latency-summary]

  # Production · Architecture at scale
  - id: arch.failure_tradeoffs
    title: Failure tradeoffs
    chapter: architecture
    requires: [rel.timeouts, rel.retry_backoff]
    freshness: core_concept
    sourceGroups: [operations]
    gap: >-
      How to keep serving when a dependency fails: circuit breakers, fallbacks, and deciding per feature whether to
      fail open or fail closed.
    depth: working
    prove: [explain, implement]
    labs: [circuit-breaker]

  - id: arch.service_boundaries
    title: Service boundaries
    chapter: architecture
    requires: [rel.partial_failures]
    freshness: core_concept
    sourceGroups: [operations, database]
    gap: >-
      When splitting a service helps and when it only adds a network hop, how to draw the line around the data each
      part owns, and how parts talk without reaching into each other's tables.
    depth: working
    prove: [explain, implement]
    labs: [service-split]

  # Applied AI · Retrieval
  - id: ai.semantic_search
    title: Embeddings
    chapter: retrieval
    requires: []
    freshness: ai_ecosystem
    sourceGroups: [ai, database]
    gap: >-
      How embeddings and vector similarity find related text, what approximate indexes trade off, and why similarity
      is not relevance.
    depth: working
    prove: [explain, implement]
    labs: [vector-search]

  - id: ai.chunking
    title: Chunking
    chapter: retrieval
    requires: [ai.semantic_search]
    freshness: ai_ecosystem
    sourceGroups: [ai]
    gap: >-
      How documents are split for retrieval, why chunk size and overlap change what can be found, and how keeping
      headings and sentence boundaries keeps chunks meaningful.
    depth: working
    prove: [explain, implement]
    labs: [chunk-boundaries]

  - id: ai.advanced_rag
    title: Hybrid search
    chapter: retrieval
    requires: [ai.chunking]
    freshness: ai_ecosystem
    sourceGroups: [ai, database]
    gap: >-
      How hybrid search, query rewriting, metadata filters and rank fusion improve retrieval beyond plain vector
      search.
    depth: deep
    prove: [explain, implement]
    labs: [rank-fusion]

  - id: ai.retrieval_eval
    title: RAG evaluation
    chapter: retrieval
    requires: [ai.semantic_search]
    freshness: ai_ecosystem
    sourceGroups: [ai]
    gap: >-
      How to measure retrieval with known relevant passages and Recall@k, changing one thing at a time.
    depth: working
    prove: [explain, implement]
    labs: [retrieval-metrics]

  # Applied AI · Model interfaces
  - id: ai.structured_outputs
    title: Structured outputs
    chapter: model-interfaces
    requires: [api.runtime_validation]
    freshness: ai_ecosystem
    sourceGroups: [ai, typescript]
    gap: >-
      How to make model output fit a schema, validate it in code, and fall back safely when it doesn't.
    depth: working
    prove: [explain, implement]
    labs: [invoice-extract]

  - id: ai.tool_calling
    title: Tool calling
    chapter: model-interfaces
    requires: [ai.structured_outputs]
    freshness: ai_ecosystem
    sourceGroups: [ai]
    gap: >-
      How models propose tool calls, how your code validates and authorizes them, and how to keep tool loops
      bounded.
    depth: working
    prove: [explain, implement]
    labs: [tool-loop]

  # Applied AI · Agents
  - id: ai.agent_patterns
    title: Agent loop
    chapter: agents
    requires: [ai.tool_calling]
    freshness: ai_ecosystem
    sourceGroups: [ai]
    gap: >-
      How an agent loop works, when a fixed workflow is better, and how stop conditions and logging keep agents
      safe.
    depth: deep
    prove: [explain, implement]
    labs: [support-workflow]

  - id: ai.agent_memory
    title: State & memory
    chapter: agents
    requires: [ai.agent_patterns]
    freshness: ai_ecosystem
    sourceGroups: [ai]
    gap: >-
      How agents remember only what the app stores and passes back, and how to write, retrieve and correct memory
      safely.
    depth: working
    prove: [explain, implement]
    labs: [chat-memory]

  - id: ai.mcp
    title: MCP
    chapter: agents
    requires: [ai.tool_calling]
    freshness: ai_ecosystem
    sourceGroups: [ai]
    gap: >-
      What MCP servers expose, how clients decide what a model may use, and why server permissions and outputs need
      care.
    depth: working
    prove: [explain, implement]
    labs: [mcp-server]

  # Applied AI · AI in production
  - id: ai.evals
    title: Evals
    chapter: ai-production
    requires: [ai.retrieval_eval, test.strategy]
    freshness: ai_ecosystem
    sourceGroups: [ai, testing]
    gap: >-
      How to build evals that run on every prompt or model change, score them reliably, and track results over time.
    depth: deep
    prove: [explain, implement]
    labs: [eval-gate]

  - id: ai.model_routing
    title: Model routing
    chapter: ai-production
    requires: [ai.evals]
    freshness: ai_ecosystem
    sourceGroups: [ai]
    gap: >-
      How to send each request to the cheapest model that handles it well, escalate when the small model isn't
      confident, cache repeats, and stay inside a budget.
    depth: working
    prove: [explain, implement]
    labs: [smart-routing]

  - id: ai.cost_latency
    title: Cost & latency
    chapter: ai-production
    requires: [ai.model_routing]
    freshness: ai_ecosystem
    sourceGroups: [ai]
    gap: >-
      How tokens drive cost and latency, and how a context budget, trimming history and limiting output keep both
      down without dropping what the model needs.
    depth: working
    prove: [explain, implement]
    labs: [context-budget]
