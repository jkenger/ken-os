# Retry & backoff, the reference topic: hand-written so it never needs generating. Spec:
# docs/architecture/engineering-rebuild.md, section 4. Every other lesson is written by the Tutor in this format.
# Its exercise is labs/retry-policy. After editing, run `pnpm --filter @ken-os/web lab:generate`.

topicId: rel.retry_backoff
checkedOn: "2026-10-10"

lesson:
  heading: A timeout is an uncertain outcome
  body: >-
    A dependency may have completed the work even though you never got its response. Before retrying, decide whether
    repeating the operation can cause harm.
  mentalModel: >-
    Retry only when repeating is safe. Space attempts out, add jitter so clients don't retry in sync, cap the delay,
    and stop after a bounded number of attempts.
  block:
    kind: formula
    content: "delay = min(1000 × 2 ** attempt, 30000)"
    note: >-
      For attempts 0, 1 and 2 that's 1, 2 and 4 seconds; the ceiling keeps waits bounded. In a real client, add jitter.
  example: >-
    Retrying a read is usually simple; retrying a payment is not. For writes, an idempotency key lets the server
    recognize the same operation.
  deeper:
    title: What changes with jitter
    body: >-
      Full jitter picks a delay between zero and the exponential cap. It spreads clients out but doesn't make an unsafe
      write safe.
  prove:
    - Implement a bounded delay policy
    - Explain an uncertain write outcome
    - Choose a safe retry strategy
  sources:
    - title: Timeouts, retries and backoff with jitter (AWS Builders' Library)
      url: https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/

proof:
  prompt: >-
    **The payment timed out. What now?** A payment provider may have accepted the request before the connection timed
    out. Explain how you would retry safely, and how you'd avoid a retry storm.
  rubric:
    - Uses an idempotency key or reconciles the earlier request
    - Caps attempts and exponential delays
    - Adds jitter to spread concurrent retries
  referenceAnswer: >-
    A timeout doesn't tell you whether the provider charged the card, so a blind retry can charge twice. Send the same
    idempotency key on every attempt so the provider returns the first result instead of charging again, or look the
    payment up before repeating it. Retry with exponential delays, capped, and stop after a few attempts. Add jitter, a
    random part of each delay, so many clients that failed together don't all retry at the same moment.
