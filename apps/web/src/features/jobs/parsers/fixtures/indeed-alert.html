<!--
  A constructed sample, not a real saved Indeed alert email — I have no real one to parse against in this
  environment. Shaped from Indeed's publicly documented job-card markup (job title as a link to
  indeed.com/viewjob?jk=<id>, company and location nearby). Re-save this from a real forwarded alert before this
  parser handles production traffic, per the spec's "parser tests on saved pages" rule
  (docs/product/job-finder.md): a layout change should fail this test, not quietly find nothing.
-->
<html>
  <body>
    <table class="jobAlert">
      <tr class="jobCard">
        <td>
          <a href="https://www.indeed.com/viewjob?jk=abc123def456" class="jobCard_title">React Developer</a>
          <span class="jobCard_company">Northwind Labs</span>
          <span class="jobCard_location">United Kingdom</span>
          <p class="jobCard_snippet">Contract role, remote-first team.</p>
        </td>
      </tr>
      <tr class="jobCard">
        <td>
          <a href="https://www.indeed.com/viewjob?jk=ghi789jkl012" class="jobCard_title">Web Developer</a>
          <span class="jobCard_company">Stark Industries</span>
          <span class="jobCard_location">United States</span>
          <p class="jobCard_snippet">Full time, on a growing product team.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
