<!--
  A constructed sample, not a real saved LinkedIn alert email — I have no real one to parse against in this
  environment. Shaped from LinkedIn's publicly documented job-card markup (job title as a link to
  linkedin.com/jobs/view/<id>, company and location nearby). Re-save this from a real forwarded alert before
  this parser handles production traffic, per the spec's "parser tests on saved pages" rule
  (docs/product/job-finder.md): a layout change should fail this test, not quietly find nothing.
-->
<html>

    <table class="job-alert">
      <tr class="job-card">
