<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jobs, first run, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.lt{--bg:oklch(0.975 0.002 265);--fg:oklch(0.22 0.005 265);--card:oklch(0.995 0.001 265);--muted:oklch(0.945 0.003 265);--mfg:oklch(0.48 0.008 265);--border:oklch(0.885 0.004 265);--pfg:oklch(0.985 0.001 265);font-family:Geist,ui-sans-serif,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:14px;line-height:1.43}
.lt *{box-sizing:border-box}
a{color:oklch(0.22 0.005 265)}a:hover{color:oklch(0.22 0.005 265)}
.lt button,.lt input,.lt select{font:inherit;color:inherit}
.lt input::placeholder{color:var(--mfg)}
.lt input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;border-radius:10.4px;border:1px solid transparent;font-weight:500;font-size:15px;white-space:nowrap;cursor:pointer;background:transparent}
.btn-p{background:var(--fg);color:var(--pfg)}
.btn-o{background:var(--bg);border-color:var(--border)}
.chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 2px 0 10px;border-radius:8.8px;border:1px solid var(--border);background:var(--card);font-size:14px;font-weight:500;white-space:nowrap}
.chip button{border:0;background:transparent;padding:0;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;color:var(--mfg)}
.inp{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:8.8px;background:var(--muted);border:1px solid transparent;width:100%;font-size:16px}
.inp input,.inp select{border:0;background:transparent;outline:0;width:100%;padding:0;appearance:none;min-width:0}
.lbl{font-size:12px;color:var(--mfg)}
.fl{font-size:15px;font-weight:500;line-height:1;padding:0}
.f{display:flex;flex-direction:column;gap:10px;border:0;margin:0;padding:0;min-width:0}
.tg{display:flex;flex-wrap:wrap;gap:2px;padding:2px;border-radius:10.4px;background:var(--muted)}
.tg button{flex:1;height:40px;padding:0 6px;border:0;border-radius:8.4px;background:transparent;font-size:14px;font-weight:500;color:var(--mfg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tg button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--border)}
</style>
</helmet>
<div class="lt" style="width: 390px; height: 1960px; position: relative; display: flex; flex-direction: column">
  <header style="height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 2px; border-bottom: 1px solid var(--border)">
    <div style="display: flex; align-items: center; gap: 2px">
      <button class="btn" style="width: 44px; padding: 0" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
      <span style="color: var(--mfg)">Jobs</span><span style="color: var(--mfg); margin: 0 6px" aria-hidden="true">/</span><span style="font-weight: 500">New</span>
    </div>
    <button class="btn" style="width: 44px; padding: 0" aria-label="Account"><span style="width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--border); display: grid; place-items: center; font-size: 12px; font-weight: 600">JK</span></button>
  </header>
  <form style="padding: 0 16px 120px; display: flex; flex-direction: column; gap: 24px">
    <div style="padding: 20px 0 14px; border-bottom: 1px solid var(--border)"><h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.025em">New</h1></div>
    <section style="display: flex; flex-direction: column; gap: 12px">
      <div>
        <h2 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.025em">Specialization</h2>
        <div class="lbl" style="margin-top: 4px; font-size: 13px">From your headline and last two titles</div>
      </div>
      <button type="button" class="btn btn-o"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Import from Profile</button>
      <ul aria-label="Roles" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px">
        <li class="chip">Full-stack Engineer<button type="button" aria-label="Remove Full-stack Engineer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></li>
        <li class="chip">Frontend Engineer<button type="button" aria-label="Remove Frontend Engineer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></li>
        <li class="chip">Software Engineer<button type="button" aria-label="Remove Software Engineer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></li>
      </ul>
      <div style="display: flex; gap: 8px">
        <label class="inp"><input placeholder="Add a role" aria-label="Add a role"></label>
        <button type="button" class="btn btn-o" style="flex: none">Add</button>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 20px; padding-top: 20px; border-top: 1px solid var(--border)">
      <div>
        <h2 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.025em">Filters</h2>
        <div class="lbl" style="margin-top: 4px; font-size: 13px">Shown beside your postings, change any time</div>
      </div>
      <fieldset class="f">
        <legend class="fl" style="margin-bottom: 10px">Pay</legend>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 4px"><span class="lbl">Minimum</span><span class="inp"><span class="lbl" style="font-size: 16px">$</span><input placeholder="2,500" inputmode="numeric"></span></label>
          <label style="display: flex; flex-direction: column; gap: 4px"><span class="lbl">Maximum</span><span class="inp"><input placeholder="Any" inputmode="numeric"></span></label>
          <label style="display: flex; flex-direction: column; gap: 4px"><span class="lbl">Currency</span><span class="inp"><select><option>USD</option></select><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></span></label>
          <label style="display: flex; flex-direction: column; gap: 4px"><span class="lbl">Period</span><span class="inp"><select><option>Per month</option></select><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></span></label>
        </div>
      </fieldset>
      <fieldset class="f">
        <legend class="fl" style="margin-bottom: 10px">Job type</legend>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="checkbox" checked="">Full time</label>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="checkbox" checked="">Contract</label>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="checkbox">Part time</label>
      </fieldset>
      <div class="f" role="group" aria-labelledby="pws"><span id="pws" class="fl">Work setup</span><div class="tg"><button type="button" aria-pressed="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Remote</button><button type="button" aria-pressed="false">Hybrid</button><button type="button" aria-pressed="false">On site</button></div></div>
      <div class="f" role="group" aria-labelledby="psn"><span id="psn" class="fl">Seniority</span><div class="tg"><button type="button" aria-pressed="false">Junior</button><button type="button" aria-pressed="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Mid</button><button type="button" aria-pressed="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Senior</button><button type="button" aria-pressed="false">Lead</button></div></div>
      <label class="f"><span class="fl">Skip words</span><span class="inp"><input placeholder="Sales, Intern"></span><span class="lbl">Hides any posting with one in its title</span></label>
      <label class="f"><span class="fl">Skip companies</span><span class="inp"><input placeholder="Add a company"></span><span class="lbl">Such as a current employer</span></label>
      <div class="f" role="group" aria-labelledby="pag"><span id="pag" class="fl">Agencies</span><div class="tg"><button type="button" aria-pressed="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Show</button><button type="button" aria-pressed="false">Hide</button></div></div>
      <label class="f"><span class="fl">Posted within</span><span class="inp"><select><option>14 days</option></select><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></span></label>
    </section>
  </form>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: var(--card); border-top: 1px solid var(--border)">
    <button type="submit" class="btn btn-p" style="width: 100%">Start matching</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1960}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
