<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jobs, New, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.lt{--bg:oklch(0.975 0.002 265);--fg:oklch(0.22 0.005 265);--card:oklch(0.995 0.001 265);--muted:oklch(0.945 0.003 265);--mfg:oklch(0.48 0.008 265);--border:oklch(0.885 0.004 265);--pfg:oklch(0.985 0.001 265);font-family:Geist,ui-sans-serif,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:14px;line-height:1.43}
.lt *{box-sizing:border-box}
a{color:oklch(0.22 0.005 265);text-decoration:none}a:hover{color:oklch(0.22 0.005 265);text-decoration:underline}
.lt button,.lt input{font:inherit;color:inherit}
.lt input::placeholder{color:var(--mfg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:10.4px;border:1px solid transparent;font-weight:500;font-size:14px;white-space:nowrap;cursor:pointer;background:transparent}
.btn-o{background:var(--bg);border-color:var(--border)}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:8.8px;border:1px solid transparent;font-size:12px;font-weight:500;white-space:nowrap;line-height:1}
.b-s{background:var(--muted)}
.b-o{border-color:var(--border)}
.inp{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:8.8px;background:var(--muted);border:1px solid transparent;width:100%;font-size:16px}
.inp input{border:0;background:transparent;outline:0;width:100%;padding:0;min-width:0}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;color:var(--mfg)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:4px}
.logo{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;flex:none;border:1px solid var(--border);background:var(--card)}
.ini{background:var(--muted);color:var(--mfg);font-weight:600;font-size:12px;border-color:transparent}
.skel{background:var(--muted);border-color:transparent;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.jc{position:relative}
.stretch::after{content:"";position:absolute;inset:0}
.lift{position:relative;z-index:1}
</style>
</helmet>
<div class="lt" style="width: 390px; height: 1900px; display: flex; flex-direction: column">
  <header style="height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 2px; border-bottom: 1px solid var(--border)">
    <div style="display: flex; align-items: center; gap: 2px">
      <button class="btn" style="width: 44px; height: 44px; padding: 0" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
      <span style="color: var(--mfg)">Jobs</span><span style="color: var(--mfg); margin: 0 6px" aria-hidden="true">/</span><span style="font-weight: 500">New</span>
    </div>
    <button class="btn" style="width: 44px; height: 44px; padding: 0" aria-label="Account"><span style="width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--border); display: grid; place-items: center; font-size: 12px; font-weight: 600">JK</span></button>
  </header>
  <main style="padding: 0 16px 32px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: baseline; gap: 10px; padding: 20px 0 14px; border-bottom: 1px solid var(--border)">
      <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.25">New</h1>
      <span class="lbl"><span class="mono">12</span> postings</span>
    </div>
    <div style="display: flex; gap: 8px">
      <label class="inp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color: var(--mfg); flex: none"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" placeholder="Search" aria-label="Search postings"></label>
      <a class="btn btn-o" href="Phone-filters.dc.html" style="height: 44px; flex: none; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"></path></svg>Filters<span class="badge" style="background: var(--fg); color: var(--pfg); padding: 0 6px"><span class="mono" aria-label="7 active">7</span></span></a>
    </div>
    <sc-for list="{{jobs}}" as="j" hint-placeholder-count="6">
      <article class="panel jc" style="padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; gap: 12px; align-items: flex-start">
          <sc-if value="{{j.isImg}}" hint-placeholder-val="{{false}}"><div class="logo" role="img" aria-label="{{j.company}} logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 9c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"></path></svg></div></sc-if>
          <sc-if value="{{j.isImg2}}" hint-placeholder-val="{{false}}"><div class="logo" role="img" aria-label="{{j.company}} logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="4"></circle><path d="M12 3v3M4.9 6.9 7 9M19.1 6.9 17 9M2 21h20"></path></svg></div></sc-if>
          <sc-if value="{{j.isIni}}" hint-placeholder-val="{{true}}"><div class="logo ini" aria-hidden="true">{{j.ini}}</div></sc-if>
          <sc-if value="{{j.isPend}}" hint-placeholder-val="{{false}}"><div class="logo skel" role="img" aria-label="Loading logo"></div></sc-if>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 13px; color: var(--mfg)">{{j.company}}</div>
            <h2 style="margin: 2px 0 0; font-size: 16px; font-weight: 600; line-height: 1.3"><a class="stretch" href="Phone-detail.dc.html">{{j.title}}</a></h2>
          </div>
          <span class="badge b-o" style="height: 28px; padding: 0 8px; flex: none" aria-label="Match score {{j.score}}"><span class="mono" style="font-size: 14px; font-weight: 600">{{j.score}}</span></span>
        </div>
        <div class="lbl" style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px">
          <span>{{j.setup}}</span><span aria-hidden="true">·</span>
          <span><span aria-hidden="true">{{j.flag}}</span> {{j.country}}</span>
          <sc-if value="{{j.hasExtra}}" hint-placeholder-val="{{false}}"><span class="mono" aria-label="and {{j.extra}} more countries">+{{j.extra}}</span></sc-if>
          <span aria-hidden="true">·</span><span>{{j.type}}</span>
        </div>
        <p style="margin: 0">{{j.snippet}}</p>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <div style="display: flex; gap: 6px; flex-wrap: wrap; min-width: 0">
            <sc-for list="{{j.skills}}" as="s" hint-placeholder-count="3"><span class="badge b-s">{{s}}</span></sc-for>
            <sc-if value="{{j.hasMore}}" hint-placeholder-val="{{false}}"><span class="badge b-o"><span class="mono">+{{j.more}}</span></span></sc-if>
          </div>
          <sc-if value="{{j.saved}}" hint-placeholder-val="{{false}}"><button class="btn btn-o lift" style="width: 44px; height: 44px; padding: 0; flex: none" aria-label="Saved" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg></button></sc-if>
          <sc-if value="{{j.unsaved}}" hint-placeholder-val="{{true}}"><button class="btn btn-o lift" style="width: 44px; height: 44px; padding: 0; flex: none" aria-label="Save" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg></button></sc-if>
        </div>
      </article>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (o) => Object.assign({ isImg: false, isImg2: false, isIni: false, isPend: false, saved: false, hasExtra: o.extra > 0, hasMore: o.more > 0 }, o, { unsaved: !o.saved });
    return {
      jobs: [
        mk({ company: 'Tidepool', isImg: true, title: 'Senior Full-stack Engineer', setup: 'Remote', flag: '🇵🇭', country: 'Philippines', extra: 10, type: 'Full time', score: 92, snippet: 'Tidepool builds scheduling software for community clinics. We are hiring a senior engineer to own features end to end across our Next.js app…', skills: ['React', 'TypeScript', 'Node.js'], more: 5 }),
        mk({ company: 'Halcyon Health', isIni: true, ini: 'HH', title: 'Frontend Engineer (React)', setup: 'Remote', flag: '🇺🇸', country: 'United States', extra: 0, type: 'Contract', score: 88, saved: true, snippet: 'Join the patient app team rebuilding our intake flow. You will ship accessible React components and own the design system…', skills: ['React', 'TypeScript', 'Storybook'], more: 2 }),
        mk({ company: 'Brightline Payments', isPend: true, title: 'Software Engineer, Platform', setup: 'Hybrid', flag: '🇸🇬', country: 'Singapore', extra: 0, type: 'Full time', score: 81, snippet: 'Our platform team runs the services that move money for 4,000 merchants. You will work on the ledger and deployment tooling…', skills: ['Go', 'Kubernetes', 'PostgreSQL'], more: 2 }),
        mk({ company: 'Corvid Analytics', isIni: true, ini: 'CA', title: 'Full-stack Developer', setup: 'Remote', flag: '🇦🇺', country: 'Australia', extra: 1, type: 'Full time', score: 77, snippet: 'Corvid turns retail point-of-sale data into weekly forecasts. You will build dashboards in Vue and the Django APIs behind them…', skills: ['Vue', 'Python', 'Django'], more: 1 }),
        mk({ company: 'Marisol Travel', isImg2: true, title: 'Senior React Native Engineer', setup: 'Remote', flag: '🇬🇧', country: 'United Kingdom', extra: 0, type: 'Contract', score: 69, snippet: 'We are rebuilding our booking app in React Native with Expo. Looking for someone who has shipped to both stores…', skills: ['React Native', 'Expo', 'Redux'], more: 1 }),
        mk({ company: 'Northwind Labs', isIni: true, ini: 'NL', title: 'Backend Engineer', setup: 'Remote', flag: '🇨🇦', country: 'Canada', extra: 2, type: 'Full time', score: 61, snippet: 'Northwind Labs makes inventory tools for independent pharmacies. The backend team owns our Spring services and the Kafka pipeline…', skills: ['Java', 'Spring', 'Kafka'], more: 4 })
      ]
    };
  }
}
</script>
</body>
</html>
