<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jobs, filters sheet, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.lt{--bg:oklch(0.975 0.002 265);--fg:oklch(0.22 0.005 265);--card:oklch(0.995 0.001 265);--muted:oklch(0.945 0.003 265);--mfg:oklch(0.48 0.008 265);--border:oklch(0.885 0.004 265);--pfg:oklch(0.985 0.001 265);font-family:Geist,ui-sans-serif,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:14px;line-height:1.43}
.lt *{box-sizing:border-box}
a{color:oklch(0.22 0.005 265);text-decoration:none}a:hover{color:oklch(0.22 0.005 265)}
.lt button,.lt input,.lt select{font:inherit;color:inherit}
.lt input::placeholder{color:var(--mfg)}
.lt input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;border-radius:10.4px;border:1px solid transparent;font-weight:500;font-size:15px;white-space:nowrap;cursor:pointer;background:transparent}
.btn-p{background:var(--fg);color:var(--pfg)}
.btn-o{background:var(--bg);border-color:var(--border)}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:8.8px;border:1px solid transparent;font-size:12px;font-weight:500;white-space:nowrap;line-height:1}
.b-c{background:var(--card);border-color:var(--border);height:30px;padding:0 2px 0 10px;font-size:14px}
.b-c button{border:0;background:transparent;padding:0;width:26px;height:26px;display:grid;place-items:center;cursor:pointer;color:var(--mfg)}
.inp{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:8.8px;background:var(--muted);border:1px solid transparent;width:100%;font-size:16px}
.inp input,.inp select{border:0;background:transparent;outline:0;width:100%;padding:0;appearance:none;min-width:0}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;color:var(--mfg)}
.fl{font-size:15px;font-weight:500;line-height:1;padding:0}
.f{display:flex;flex-direction:column;gap:10px;border:0;margin:0;padding:0;min-width:0}
.tg{display:flex;flex-wrap:wrap;gap:2px;padding:2px;border-radius:10.4px;background:var(--muted)}
.tg button{flex:1;height:40px;padding:0 6px;border:0;border-radius:8.4px;background:transparent;font-size:14px;font-weight:500;color:var(--mfg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tg button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--border)}
</style>
</helmet>
<div class="lt" style="width: 390px; height: 1500px; position: relative; background: oklch(0.22 0.005 265 / 0.45)">
  <div role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; inset: 24px 0 0 0; background: var(--card); border-radius: 14px 14px 0 0; box-shadow: 0 -10px 30px rgb(0 0 0 / 0.12); display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 4px 0 16px; border-bottom: 1px solid var(--border)">
      <div style="display: flex; align-items: center; gap: 8px"><h2 id="sheet-title" style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.025em">Filters</h2><span class="badge" style="background: var(--fg); color: var(--pfg)"><span class="mono">7</span> active</span></div>
      <a class="btn" href="Phone-new.dc.html" style="width: 44px; padding: 0" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
    </div>
    <div style="flex: 1; padding: 20px 16px 120px; display: flex; flex-direction: column; gap: 22px">
      <fieldset class="f">
        <legend class="fl" style="margin-bottom: 10px">Pay</legend>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 4px"><span class="lbl">Minimum</span><span class="inp"><input value="2,500" inputmode="numeric"></span></label>
          <label style="display: flex; flex-direction: column; gap: 4px"><span class="lbl">Maximum</span><span class="inp"><input placeholder="Any" inputmode="numeric"></span></label>
          <label style="display: flex; flex-direction: column; gap: 4px"><span class="lbl">Currency</span><span class="inp"><select><option>USD</option></select><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></span></label>
          <label style="display: flex; flex-direction: column; gap: 4px"><span class="lbl">Period</span><span class="inp"><select><option>Per month</option></select><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></span></label>
        </div>
      </fieldset>
      <fieldset class="f">
        <legend class="fl" style="margin-bottom: 10px">Job type</legend>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="checkbox" checked="">Full time</label>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="checkbox" checked="">Contract</label>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="checkbox">Part time</label>
      </fieldset>
      <div class="f" role="group" aria-labelledby="fws"><span id="fws" class="fl">Work setup</span><div class="tg"><button aria-pressed="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Remote</button><button aria-pressed="false">Hybrid</button><button aria-pressed="false">On site</button></div></div>
      <div class="f" role="group" aria-labelledby="fsn"><span id="fsn" class="fl">Seniority</span><div class="tg"><button aria-pressed="false">Junior</button><button aria-pressed="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Mid</button><button aria-pressed="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Senior</button><button aria-pressed="false">Lead</button></div></div>
      <label class="f"><span class="fl">Skip words</span><span class="inp" style="height: auto; min-height: 44px; flex-wrap: wrap; padding: 6px 8px; gap: 6px"><span class="badge b-c">Sales<button aria-label="Remove Sales"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span><input placeholder="Add a word" style="width: 120px; flex: 1"></span></label>
      <label class="f"><span class="fl">Skip companies</span><span class="inp"><input placeholder="Add a company"></span></label>
      <div class="f" role="group" aria-labelledby="fag"><span id="fag" class="fl">Agencies</span><div class="tg"><button aria-pressed="false">Show</button><button aria-pressed="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Hide</button></div></div>
      <label class="f"><span class="fl">Posted within</span><span class="inp"><select><option>14 days</option></select><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></span></label>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 8px">
      <button class="btn btn-o" style="flex: none">Clear all</button>
      <a class="btn btn-p" href="Phone-new.dc.html" style="flex: 1; color: var(--pfg)">Show <span class="mono">12</span> postings</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
