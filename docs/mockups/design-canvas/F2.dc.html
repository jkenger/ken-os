<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F2 1024 wide, inspector as a Sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<dc-import name="Workspace" variant="F2" hint-size="1024px,768px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
