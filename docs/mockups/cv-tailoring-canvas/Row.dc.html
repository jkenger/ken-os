<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job detail title row</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.cv{--bg:oklch(0.975 0.002 265);--fg:oklch(0.22 0.005 265);--card:oklch(0.995 0.001 265);--pop:oklch(0.995 0.001 265);--muted:oklch(0.945 0.003 265);--mfg:oklch(0.48 0.008 265);--border:oklch(0.885 0.004 265);--pfg:oklch(0.985 0.001 265);--red:oklch(0.53 0.19 25);font-family:Geist,ui-sans-serif,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:14px;line-height:1.43}
.cv.dk{--bg:oklch(0.205 0.004 265);--fg:oklch(0.93 0.004 100);--card:oklch(0.235 0.005 265);--pop:oklch(0.255 0.006 265);--muted:oklch(0.275 0.006 265);--mfg:oklch(0.74 0.006 100);--border:oklch(0.33 0.008 265);--pfg:oklch(0.205 0.004 265);--red:oklch(0.72 0.15 20)}
.cv *{box-sizing:border-box}
.cv button{font:inherit}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:10.4px;border:1px solid transparent;font-weight:500;font-size:14px;white-space:nowrap;cursor:pointer;background:transparent;color:var(--fg);text-decoration:none}
.btn-p{background:var(--fg);color:var(--pfg) !important}
.btn-o{background:var(--bg);border-color:var(--border)}
.dk .btn-o{background:transparent}
.btn-g:hover{background:var(--muted)}
.btn-icon{width:36px;padding:0}
.btn-xs{height:24px;padding:0 10px;font-size:12px;gap:4px}
.btn[disabled],.dis{opacity:.5;pointer-events:none}
.arw{transition:transform .2s ease-out}
.btn:hover .arw{transform:translate(2px,-2px)}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
.rb{display:inline-flex;padding:1.5px;border-radius:10.4px;background:conic-gradient(from var(--ang),oklch(0.68 0.19 25),oklch(0.78 0.16 75),oklch(0.72 0.17 150),oklch(0.66 0.15 230),oklch(0.62 0.2 295),oklch(0.68 0.19 25))}
.rb-idle{opacity:.45}
.rb-idle:hover{opacity:1}
.rb-busy{animation:rbspin 1.6s linear infinite}
@keyframes rbspin{to{--ang:360deg}}
.rbi{height:33px;border:0;border-radius:9px;background:var(--bg)}
.rb .btn[disabled],.rb .dis{opacity:1;color:var(--mfg)}
.seg{height:33px;border:0;border-radius:9px;background:transparent}
.seg:hover{background:var(--muted)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{width:3px;height:3px;border-radius:50%;background:var(--mfg);display:inline-block}
.tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--pfg);font-size:12px;line-height:1;padding:7px 10px;border-radius:6px;white-space:nowrap}
.tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--fg)}
.ctx{border:1px dashed var(--border);border-radius:4px;display:flex;align-items:flex-start;padding:14px 16px;font-size:12px;color:var(--mfg)}
</style>
</helmet>
<div class="{{rootClass}}" style="{{rootStyle}}">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs><linearGradient id="cvRainbow" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="oklch(0.62 0.2 25)"></stop><stop offset="0.3" stop-color="oklch(0.72 0.16 75)"></stop><stop offset="0.55" stop-color="oklch(0.62 0.17 150)"></stop><stop offset="0.8" stop-color="oklch(0.6 0.15 230)"></stop><stop offset="1" stop-color="oklch(0.58 0.2 295)"></stop></linearGradient></defs></svg>
  <div style="{{gridStyle}}">
    <sc-if value="{{isDesk}}" hint-placeholder-val="{{true}}"><div class="ctx" aria-hidden="true">Profile match panel, unchanged</div></sc-if>
    <div style="display: flex; flex-direction: column; gap: 24px; min-width: 0">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 3.2px; background: var(--muted); color: var(--mfg); display: grid; place-items: center; font-weight: 600; font-size: 16px">TP</span>
          <span style="font-weight: 500">Tidepool</span>
        </div>
        <div style="text-align: right">
          <p style="margin: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 12px; color: var(--mfg)"><span>Posted 3d ago</span><span class="dot" aria-hidden="true"></span><span>Updated 1d ago</span></p>
          <button class="btn btn-o btn-xs" disabled="" style="margin-top: 6px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>Save to board</button>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px">
        <h1 style="margin: 0; max-width: 576px; font-size: 24px; font-weight: 600; line-height: 1.3">Senior Full-stack Engineer</h1>
        <div style="display: flex; gap: 10px; flex: none">
          <sc-if value="{{tailorIdle}}" hint-placeholder-val="{{true}}">
            <span class="rb rb-idle"><button class="btn rbi"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="url(#cvRainbow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"></path></svg>Tailor my CV</button></span>
          </sc-if>
          <sc-if value="{{tailorBusy}}" hint-placeholder-val="{{false}}">
            <span class="rb rb-busy"><button class="btn rbi" disabled="" aria-busy="true"><svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="url(#cvRainbow)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>Tailor my CV</button></span>
          </sc-if>
          <sc-if value="{{hasCv}}" hint-placeholder-val="{{false}}">
            <span class="rb" role="group" aria-label="Tailored CV">
              <span class="rbi" style="display: inline-flex; align-items: center">
                <a class="btn seg" href="#" target="_blank" rel="noopener noreferrer">View tailored CV<svg class="arw" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="url(#cvRainbow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"></path></svg></a>
                <span aria-hidden="true" style="width: 1px; height: 18px; background: var(--border)"></span>
                <span style="position: relative; display: inline-flex">
                  <button class="btn seg btn-icon" aria-label="Regenerate tailored CV"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="url(#cvRainbow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg></button>
                  <sc-if value="{{showTip}}" hint-placeholder-val="{{false}}"><span class="tip" role="tooltip">Regenerate</span></sc-if>
                </span>
              </span>
            </span>
          </sc-if>
          <a class="btn btn-p" href="#">Apply<svg class="arw" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"></path></svg></a>
        </div>
      </div>
    </div>
  </div>
  <sc-if value="{{showToast}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; right: 24px; bottom: 24px; width: 356px; display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--pop); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); font-size: 13px; font-weight: 500">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color: var(--red); flex: none"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6M9 9l6 6"></path></svg>
      Couldn't generate. Try again
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["A1","A2","A3","A4","A5","A6","P1","P3"],"default":"A3"},"$preview":{"width":1440,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'A3';
    const phone = v === 'P1' || v === 'P3';
    const hasCv = v === 'A3' || v === 'A6' || v === 'P3';
    const H = { A1: 280, A2: 280, A3: 300, A4: 300, A5: 440, A6: 300 }[v] || 0;
    return {
      rootClass: v === 'A6' ? 'cv dk' : 'cv',
      rootStyle: phone ? 'width: 390px; padding: 20px 16px 24px; position: relative' : 'width: 1440px; height: ' + H + 'px; padding: 56px 40px 0; position: relative; overflow: hidden',
      gridStyle: phone ? 'display: block' : 'max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 32px',
      isDesk: !phone,
      tailorIdle: v === 'A1' || v === 'A5' || v === 'P1',
      tailorBusy: v === 'A2' || v === 'A4',
      hasCv,
      showTip: v === 'A3' || v === 'A6',
      showToast: v === 'A5'
    };
  }
}
</script>
</body>
</html>
