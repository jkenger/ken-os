<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>E7 Tailored CV modal</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
          }
          .m {
            --bg: oklch(0.975 0.002 265);
            --fg: oklch(0.22 0.005 265);
            --pop: oklch(0.995 0.001 265);
            --muted: oklch(0.945 0.003 265);
            --mfg: oklch(0.48 0.008 265);
            --border: oklch(0.885 0.004 265);
            --pfg: oklch(0.985 0.001 265);
            --rainbow: linear-gradient(
              90deg,
              oklch(0.68 0.19 25),
              oklch(0.78 0.16 75),
              oklch(0.72 0.17 150),
              oklch(0.66 0.15 230),
              oklch(0.62 0.2 295),
              oklch(0.68 0.19 25)
            );
          }
          .m * {
            box-sizing: border-box;
          }
          .m button {
            font: inherit;
            color: inherit;
          }
          a {
            color: inherit;
            text-decoration: none;
          }
          a:hover {
            color: inherit;
          }
          .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 36px;
            padding: 0 12px;
            border-radius: 10.4px;
            border: 1px solid transparent;
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            background: transparent;
            color: var(--fg);
          }
          .ring {
            display: inline-flex;
            align-items: center;
            border: 1.5px solid transparent;
            border-radius: 10.4px;
            background-image:
              linear-gradient(var(--pop), var(--pop)), var(--rainbow);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            background-size:
              100% 100%,
              300% 100%;
          }
          .ring .btn {
            height: 33px;
            border: 0;
            border-radius: 9px;
          }
          .ring .btn:hover {
            background: var(--muted);
          }
          .arw {
            transition: transform 0.2s ease-out;
          }
          .btn:hover .arw {
            transform: translate(2px, -2px);
          }
        </style>
      </helmet>
      <div
        class="m"
        style="
          width: 1000px;
          height: 760px;
          position: relative;
          overflow: hidden;
          background: oklch(0.975 0.002 265);
          font-family: Geist, ui-sans-serif, system-ui, sans-serif;
          color: oklch(0.22 0.005 265);
          font-size: 14px;
          line-height: 1.43;
        "
      >
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
          <defs>
            <linearGradient id="rbw7" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="oklch(0.62 0.2 25)"></stop>
              <stop offset="0.3" stop-color="oklch(0.72 0.16 75)"></stop>
              <stop offset="0.55" stop-color="oklch(0.62 0.17 150)"></stop>
              <stop offset="0.8" stop-color="oklch(0.6 0.15 230)"></stop>
              <stop offset="1" stop-color="oklch(0.58 0.2 295)"></stop>
            </linearGradient>
          </defs>
        </svg>
        <div aria-hidden="true">
          <dc-import
            name="Card"
            variant="E4"
            hint-size="1000px,380px"
          ></dc-import>
          <dc-import
            name="Card"
            variant="E1"
            hint-size="1000px,380px"
          ></dc-import>
        </div>
        <div
          style="
            position: absolute;
            inset: 0;
            background: oklch(0.22 0.005 265 / 0.4);
            display: grid;
            place-items: center;
            padding: 16px;
          "
        >
          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby="tcv-t"
            aria-describedby="tcv-d"
            style="
              position: relative;
              width: 480px;
              background: var(--pop);
              border: 1px solid var(--border);
              border-radius: 10.4px;
              box-shadow:
                0 20px 25px -5px rgb(0 0 0 / 0.1),
                0 8px 10px -6px rgb(0 0 0 / 0.1);
              padding: 24px;
              display: flex;
              flex-direction: column;
              gap: 20px;
            "
          >
            <button
              class="btn"
              aria-label="Close"
              style="
                position: absolute;
                top: 12px;
                right: 12px;
                width: 32px;
                height: 32px;
                padding: 0;
                color: var(--mfg);
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M18 6 6 18M6 6l12 12"></path>
              </svg>
            </button>
            <div
              style="
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding-right: 32px;
              "
            >
              <h2
                id="tcv-t"
                style="
                  margin: 0;
                  font-size: 18px;
                  font-weight: 600;
                  letter-spacing: -0.02em;
                "
              >
                Tailored CV
              </h2>
              <p id="tcv-d" style="margin: 0; color: var(--mfg)">
                Senior Full-stack Engineer at Tidepool
              </p>
            </div>
            <div
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 14px 16px;
                border: 1px solid var(--border);
                border-radius: 5.6px;
              "
            >
              <span
                aria-hidden="true"
                style="
                  width: 40px;
                  height: 40px;
                  border-radius: 3.2px;
                  background: var(--muted);
                  display: grid;
                  place-items: center;
                "
                ><svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="url(#rbw7)"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"
                  ></path>
                  <path
                    d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"
                  ></path></svg
              ></span>
              <div style="flex: 1; min-width: 0">
                <div style="font-weight: 500">Tailored CV, PDF</div>
                <div style="font-size: 12px; color: var(--mfg)">
                  Made
                  <span style="font-family: &quot;Geist Mono&quot;, monospace"
                    >Nov 17</span
                  >
                </div>
              </div>
            </div>
            <div style="display: flex; justify-content: flex-end">
              <span class="ring" role="group" aria-label="Tailored CV">
                <a
                  class="btn"
                  href="#"
                  target="_blank"
                  rel="noopener noreferrer"
                  >View tailored CV<svg
                    class="arw"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="url(#rbw7)"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M7 17 17 7M7 7h10v10"></path></svg
                ></a>
                <span
                  aria-hidden="true"
                  style="width: 1px; height: 18px; background: var(--border)"
                ></span>
                <button
                  class="btn"
                  style="width: 36px; padding: 0"
                  aria-label="Regenerate tailored CV"
                >
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="url(#rbw7)"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path
                      d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"
                    ></path>
                    <path d="M21 3v5h-5"></path>
                    <path
                      d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"
                    ></path>
                    <path d="M8 16H3v5"></path>
                  </svg>
                </button>
              </span>
            </div>
          </div>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":1000,"height":760}}'
    >
      class Component extends DCLogic {
        renderVals() { return {}; }
      }
    </script>
  </body>
</html>
