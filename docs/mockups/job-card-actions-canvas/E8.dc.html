<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>E8 Cover letter modal</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
          }
          .m {
            --bg: oklch(0.975 0.002 265);
            --fg: oklch(0.22 0.005 265);
            --pop: oklch(0.995 0.001 265);
            --muted: oklch(0.945 0.003 265);
            --mfg: oklch(0.48 0.008 265);
            --border: oklch(0.885 0.004 265);
            --pfg: oklch(0.985 0.001 265);
          }
          .m * {
            box-sizing: border-box;
          }
          .m button,
          .m textarea {
            font: inherit;
            color: inherit;
          }
          .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 36px;
            padding: 0 12px;
            border-radius: 10.4px;
            border: 1px solid transparent;
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            background: transparent;
            color: var(--fg);
          }
          .btn-p {
            background: var(--fg);
            color: var(--pfg);
          }
          .btn-o {
            background: var(--bg);
            border-color: var(--border);
          }
          .btn[disabled] {
            opacity: 0.5;
            pointer-events: none;
          }
          .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
          }
        </style>
      </helmet>
      <div
        class="m"
        style="
          width: 1000px;
          height: 900px;
          position: relative;
          overflow: hidden;
          background: oklch(0.975 0.002 265);
          font-family: Geist, ui-sans-serif, system-ui, sans-serif;
          color: oklch(0.22 0.005 265);
          font-size: 14px;
          line-height: 1.43;
        "
      >
        <div aria-hidden="true">
          <dc-import
            name="Card"
            variant="E6"
            hint-size="1000px,380px"
          ></dc-import>
          <dc-import
            name="Card"
            variant="E1"
            hint-size="1000px,380px"
          ></dc-import>
          <dc-import
            name="Card"
            variant="E1"
            hint-size="1000px,380px"
          ></dc-import>
        </div>
        <div
          style="
            position: absolute;
            inset: 0;
            background: oklch(0.22 0.005 265 / 0.4);
            display: grid;
            place-items: center;
            padding: 16px;
          "
        >
          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby="cl-t"
            aria-describedby="cl-d"
            style="
              position: relative;
              width: 640px;
              background: var(--pop);
              border: 1px solid var(--border);
              border-radius: 10.4px;
              box-shadow:
                0 20px 25px -5px rgb(0 0 0 / 0.1),
                0 8px 10px -6px rgb(0 0 0 / 0.1);
              padding: 24px;
              display: flex;
              flex-direction: column;
              gap: 16px;
            "
          >
            <button
              class="btn"
              aria-label="Close"
              style="
                position: absolute;
                top: 12px;
                right: 12px;
                width: 32px;
                height: 32px;
                padding: 0;
                color: var(--mfg);
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M18 6 6 18M6 6l12 12"></path>
              </svg>
            </button>
            <div
              style="
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding-right: 32px;
              "
            >
              <h2
                id="cl-t"
                style="
                  margin: 0;
                  font-size: 18px;
                  font-weight: 600;
                  letter-spacing: -0.02em;
                "
              >
                Cover letter
              </h2>
              <p id="cl-d" style="margin: 0; color: var(--mfg)">
                Senior Full-stack Engineer at Tidepool
              </p>
            </div>
            <label for="cl-text" class="sr">Cover letter</label>
            <textarea
              id="cl-text"
              style="
                width: 100%;
                min-height: 380px;
                resize: vertical;
                padding: 16px 18px;
                border-radius: 8.8px;
                background: var(--muted);
                border: 1px solid transparent;
                font-size: 15px;
                line-height: 1.7;
                outline: 0;
                display: block;
              "
            >
Dear Tidepool hiring team,

I'm applying for the Senior Full-stack Engineer role. I build features end to end in React, TypeScript and Node, and most recently moved a scheduling flow onto Next.js and PostgreSQL, from the schema change to the last screen.

The way your team works, close to design and across time zones, matches how I like to build: small, steady slices that reach clinics quickly. I'd welcome the chance to talk about how I could help grow your patient and staff tools.

Best regards,
[Your name]</textarea>
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
              "
            >
              <span style="font-size: 12px; color: var(--mfg)"
                >Written
                <span style="font-family: &quot;Geist Mono&quot;, monospace"
                  >Nov 17</span
                ></span
              >
              <div style="display: flex; gap: 8px">
                <button class="btn btn-o">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <rect x="8" y="8" width="14" height="14" rx="2"></rect>
                    <path
                      d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
                    ></path></svg
                  >Copy letter
                </button>
                <button class="btn btn-o">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path
                      d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"
                    ></path>
                    <path d="M21 3v5h-5"></path>
                    <path
                      d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"
                    ></path>
                    <path d="M8 16H3v5"></path></svg
                  >Regenerate
                </button>
                <button class="btn btn-p" disabled="">Save</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":1000,"height":900}}'
    >
      class Component extends DCLogic {
        renderVals() { return {}; }
      }
    </script>
  </body>
</html>
